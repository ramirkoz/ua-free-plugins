name: Finalize v1.0.29 Tag

on:
  push:
    branches: [main]
    paths: [.retag-v1.0.29.trigger]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tag to clean finalized commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1.0.29 662243af84aa7c5b3e08af5817c3def546c03e44
          git push origin refs/tags/v1.0.29 --force
