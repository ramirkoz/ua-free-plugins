name: Publish KOZ Suite 1.0.27

on:
  push:
    branches:
      - main
    paths:
      - .release/kozsuite-1.0.27.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish verified 0.9.37
        shell: bash
        run: |
          set -euo pipefail

          test -f .release/kozsuite-1.0.27.trigger
          shopt -s nullglob
          PARTS=(.release/parts/kozstx-0.9.37.part-[0-9][0-9])
          test "${#PARTS[@]}" -eq 15

          cat "${PARTS[@]}" > /tmp/kozstx-0.9.37.b64
          base64 --decode /tmp/kozstx-0.9.37.b64 > /tmp/KOZ-Static-Translate-0.9.37.zip
          echo '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb  /tmp/KOZ-Static-Translate-0.9.37.zip' | sha256sum -c -
          unzip -t /tmp/KOZ-Static-Translate-0.9.37.zip

          rm -rf /tmp/kozstx-0937
          mkdir -p /tmp/kozstx-0937
          unzip -q /tmp/KOZ-Static-Translate-0.9.37.zip -d /tmp/kozstx-0937
          test "$(find /tmp/kozstx-0937/koz-static-translate -type f | wc -l)" -eq 28
          grep -q 'Version: 0.9.37' /tmp/kozstx-0937/koz-static-translate/koz-static-translate.php
          grep -q "define( 'KOZSTX_VERSION', '0.9.37' )" /tmp/kozstx-0937/koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.37' /tmp/kozstx-0937/koz-static-translate/readme.txt
          grep -q "return current_user_can( 'manage_options' );" /tmp/kozstx-0937/koz-static-translate/includes/class-kozstx-static-translate.php
          ! grep -R "permission_callback.*__return_true" /tmp/kozstx-0937/koz-static-translate --include='*.php'
          ! grep -R "deactivate_plugins" /tmp/kozstx-0937/koz-static-translate --include='*.php'

          rm -rf koz-static-translate
          cp -a /tmp/kozstx-0937/koz-static-translate ./koz-static-translate

          mkdir -p dist/packages dist/checksums
          cp /tmp/KOZ-Static-Translate-0.9.37.zip dist/packages/koz-static-translate-0.9.37.zip
          printf '%s  %s\n' '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb' 'koz-static-translate-0.9.37.zip' > dist/checksums/koz-static-translate-0.9.37.zip.sha256
          rm -f dist/packages/koz-static-translate-0.9.36.zip dist/checksums/koz-static-translate-0.9.36.zip.sha256

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('dist/manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['version'] = '1.0.27'
          data['suite_version'] = '1.0.27'
          data['created'] = '2026-08-26'
          data['release_date'] = '2026-08-26'
          data['status'] = 'CURRENT LIBRARY — 12/12 LIVE + PLUGIN CHECK PASS — WORDPRESS 7.1'

          for item in data.get('changed_components', []):
              if item.get('name') == 'KOZ Static Translate':
                  item['version'] = '0.9.37'
                  item['sha256'] = '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb'
                  item['live'] = 'PASS'
                  item['plugin_check'] = 'PASS'
                  item['wordpress_7_1'] = 'PASS'

          for item in data.get('packages', []):
              if item.get('slug') == 'koz-static-translate':
                  item['version'] = '0.9.37'
                  item['file'] = 'packages/koz-static-translate-0.9.37.zip'
                  item['sha256'] = '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb'
                  item['size'] = 153336
                  item['strict_re_audit'] = 'PASS'
                  item['live_functional'] = 'PASS'
                  item['plugin_check'] = 'PASS'
                  item['wordpress_org_ready'] = 'YES'
                  item['wordpress_core_tested'] = '7.1 PASS'
                  item['wordpress_org_status'] = '0.9.37 REVIEW REMEDIATION PASS — SUBMITTED FOR WORDPRESS.ORG REVIEW'

          for item in data.get('private_components', []):
              if item.get('slug') == 'koz-suite-hub-private':
                  item['version'] = '0.4.8'
                  item['included_in_public_bundle'] = False
                  item['status'] = 'FINAL — LIVE UI PASS — COPY ISOLATION PASS — LOCAL TEST PASS'
                  item['sha256'] = '17ae87118b09aee333cba11c4f6ba65dfe9e69c8ce2f755c74a2d6f61fdf45d6'

          data.setdefault('wordpress_org', {})['koz-static-translate'] = '0.9.37 SUBMITTED — REVIEW IN PROGRESS'
          data.pop('changes_from_1_0_25', None)
          data['changes_from_1_0_26'] = [
              'KOZ Static Translate updated from 0.9.36 to 0.9.37.',
              'WordPress.org review remediation complete.',
              'Public readable source synchronized to GitHub.',
              'Other 11 public plugin packages remain unchanged from KOZ Suite 1.0.26.'
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          r = Path('README.md')
          text = r.read_text(encoding='utf-8')
          text = text.replace('Suite bundle: **1.0.26**', 'Suite bundle: **1.0.27**')
          text = text.replace('| koz-static-translate | 0.9.36 |', '| koz-static-translate | 0.9.37 |')
          text = text.replace('**KOZ Suite Bundle 1.0.26**', '**KOZ Suite Bundle 1.0.27**')
          text = text.replace('KOZ Suite Hub — Private 0.4.6', 'KOZ Suite Hub — Private 0.4.8')
          r.write_text(text, encoding='utf-8')
          PY

          cat > RELEASE_NOTES_v1.0.27.md <<'MD'
          # KOZ WordPress Plugin Suite 1.0.27

          KOZ Suite 1.0.27 updates KOZ Static Translate from 0.9.36 to 0.9.37. The other 11 public plugin packages remain unchanged from Suite 1.0.26.

          ## KOZ Static Translate 0.9.37

          - WordPress.org review remediation completed.
          - Public human-readable source synchronized to GitHub.
          - Plugin-owned JavaScript and CSS use WordPress enqueue APIs.
          - Dynamic translation REST writes require administrator capability and WordPress REST nonce authentication.
          - Automatic deactivation of the legacy plugin is removed.
          - Microsoft Azure Translator external-service documentation is included.
          - Plugin Check, live regression and WordPress 7.1 compatibility: PASS.

          ## Verification

          - KOZ Static Translate 0.9.37 SHA-256: `3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb`.
          - Public plugins: 12/12 PASS.
          MD

          rm -rf .release

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release KOZ Static Translate 0.9.37 and Suite 1.0.27'
          git push origin HEAD:main
