name: Publish KOZ Suite 1.0.27

on:
  push:
    branches:
      - main
    paths:
      - .release/kozsuite-1.0.27.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize verified release
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .release/kozsuite-1.0.27.trigger ]; then
            exit 0
          fi

          PACKAGE='.release/KOZ-Static-Translate-0.9.37.zip'
          test -f "$PACKAGE"
          unzip -t "$PACKAGE"

          rm -rf /tmp/kozstx-0937
          mkdir -p /tmp/kozstx-0937
          unzip -q "$PACKAGE" -d /tmp/kozstx-0937

          cat > /tmp/kozstx-0937.sha256 <<'SUMS'
          282e9dd33191e738dea5437a5f460f37a6d50536eeb367425280814b6ba6ac16 koz-static-translate/CHANGELOG.md
          d7a199d061d58b9b50adf9ba08775c468c6ec1c60df7ad98dfff74bd54d5f67d koz-static-translate/README.md
          d527ce96084bad2d564a2752031dabf9108ad8f89b4796804514830f58cde234 koz-static-translate/assets/admin.css
          2bc3e9ac297d2179ea9dca060aeaf4fe2a1be6da2df9d14178185967cbcae3ba koz-static-translate/assets/admin.js
          fd4596ac783565d3caf87e49f51173e806a9ee130943943943fb143c9e78e988 koz-static-translate/assets/dynamic-translator.js
          b0d92de5537bb4411b14dafd5185391b89e6de8347e7336becaae4c78df20959 koz-static-translate/assets/gallery-compat.js
          9097cf5f5a14ebc341f6e5f38cc13185bacce59ebbab04c2f0411ecbf98e76ba koz-static-translate/assets/i18n/ar.json
          47a1ce36bbf67cfd88fbb857afa275fbd3dfbc5ef4e98d3d6d3b717eea93fe3e koz-static-translate/assets/i18n/de.json
          06b3f99695f0e06064d902493f14bc35e8114df5f13dcc82e17e58aa28bc4922 koz-static-translate/assets/i18n/es.json
          6f83bed9f43032c7d783b077a6ee665411e17634bd838a42aa4e9dd142706ddd koz-static-translate/assets/i18n/fr.json
          fd0efa1f40ed11eac332dacb3f6ca5270c87fd7c2fdb425efa0b309a14c19de9 koz-static-translate/assets/i18n/hi.json
          a65ca695af63c3a02bf64e661f28272cc1fcc106eb10b10e93964ba2c90d3b51 koz-static-translate/assets/i18n/id.json
          ce765dc77ecac23b8a51de807c116b2e07a87e45529bf540712928c74ecbb64b koz-static-translate/assets/i18n/ja.json
          ba0f4c39b0832ed6acf3b60e2bb0e9846b5a16e5abea9258a5e9ce0dc2dcd13b koz-static-translate/assets/i18n/pt.json
          b61923fd6f48e98f3ff9b95c9f6d9b6c87ca38c974eba6b0c51872ccd30d5cfc koz-static-translate/assets/i18n/uk.json
          dc2ebe22b722d4a2f71a9631494fc335d054a8221c8bf295dcea07d31bec0c55 koz-static-translate/assets/i18n/zh.json
          d8ee080403deb6dbbc0d11d6d8d047495d087db64bd26fac1dd3225d4d4901a7 koz-static-translate/assets/koz-admin-support-panel.css
          6f1ffdce2670b2d587c7d506dcc0612d65013b6779b12000246a7afe977de4d2 koz-static-translate/assets/koz-admin-support-panel.js
          55c17a62353f7dd208cfc579ed02d79648a3781e432708b7c6d4bf340d9a3b6a koz-static-translate/assets/language-link-guard.js
          93eeb03820b4991394d38192309be7b4a47b6d331acab4dee5ea220ff23f8b70 koz-static-translate/assets/wait.css
          c69070e8cbba7e8d4f6286cc3fbfdc81898da5e5c3201cca50455607d25433b8 koz-static-translate/assets/wait.js
          a4fbf24a6f9a3549250650241f7f9fae7d574030d834d7523eb3b0ee0dc74193 koz-static-translate/includes/class-kozstx-admin-support-panel.php
          e1df8e3280b30dd28ba0ec76db7f3ff8c70cbc8226207687cc0b3371a76f1e02 koz-static-translate/includes/class-kozstx-cleanup.php
          ebc7be7192edaa8f9f93f3b144361ae712210d28b8dbc8cb65ff41cf06568fb9 koz-static-translate/includes/class-kozstx-static-translate.php
          1ab391cdc6b0b2683074c187b8045cfae5a1e8acf4b8ed7415cf9abf27f3ce25 koz-static-translate/includes/class-kozstx-suite-registry.php
          3f70bb937fabae605d8bf17c29cb1773aee701c9a42c3ef396d91df5d0aa4c90 koz-static-translate/koz-static-translate.php
          6c3f86989d8fcb70c653a86c62ffcf778e5d0f3752e4997a94ffce9c217725f3 koz-static-translate/languages/koz-static-translate.pot
          9cf44d6154847cd8a0a6bf1c4777fa6492ed67f7a7adec08b451e6b2516a5905 koz-static-translate/readme.txt
          SUMS

          test "$(find /tmp/kozstx-0937/koz-static-translate -type f | wc -l)" -eq 28
          (cd /tmp/kozstx-0937 && sha256sum -c /tmp/kozstx-0937.sha256)
          grep -q 'Version: 0.9.37' /tmp/kozstx-0937/koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.37' /tmp/kozstx-0937/koz-static-translate/readme.txt

          rm -rf koz-static-translate
          cp -a /tmp/kozstx-0937/koz-static-translate ./koz-static-translate

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('dist/manifest.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          data['version'] = '1.0.27'
          data['suite_version'] = '1.0.27'
          data['created'] = '2026-08-26'
          data['release_date'] = '2026-08-26'
          data['status'] = 'CURRENT LIBRARY — 12/12 LIVE + PLUGIN CHECK PASS — WORDPRESS 7.1'

          for item in data.get('changed_components', []):
              if item.get('name') == 'KOZ Static Translate':
                  item['version'] = '0.9.37'
                  item['sha256'] = '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb'
                  item['live'] = 'PASS'
                  item['plugin_check'] = 'PASS'
                  item['wordpress_7_1'] = 'PASS'

          for item in data.get('packages', []):
              if item.get('slug') == 'koz-static-translate':
                  item['version'] = '0.9.37'
                  item['file'] = 'packages/koz-static-translate-0.9.37.zip'
                  item['sha256'] = '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb'
                  item['size'] = 153336
                  item['strict_re_audit'] = 'PASS'
                  item['live_functional'] = 'PASS'
                  item['plugin_check'] = 'PASS'
                  item['wordpress_org_ready'] = 'YES'
                  item['wordpress_core_tested'] = '7.1 PASS'
                  item['wordpress_org_status'] = '0.9.37 REVIEW REMEDIATION PASS — READY FOR WORDPRESS.ORG RESUBMISSION'

          for item in data.get('private_components', []):
              if item.get('slug') == 'koz-suite-hub-private':
                  item['version'] = '0.4.8'
                  item['included_in_public_bundle'] = False
                  item['status'] = 'FINAL — LIVE UI PASS — COPY ISOLATION PASS — LOCAL TEST PASS'
                  item['sha256'] = '17ae87118b09aee333cba11c4f6ba65dfe9e69c8ce2f755c74a2d6f61fdf45d6'

          data.setdefault('wordpress_org', {})['koz-static-translate'] = '0.9.37 REVIEW REMEDIATION PASS — READY FOR RESUBMISSION'
          data.pop('changes_from_1_0_25', None)
          data['changes_from_1_0_26'] = [
              'KOZ Static Translate updated from 0.9.36 to 0.9.37.',
              'WordPress.org review remediation 5/5 complete.',
              'Frontend plugin assets are enqueue-managed; privileged dynamic translation REST writes require manage_options and a REST nonce.',
              'Automatic legacy plugin deactivation was removed; external Azure service/source documentation was completed.',
              'Other 11 public plugin packages remain unchanged from KOZ Suite 1.0.26.',
          ]
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Suite bundle: **1.0.26**', 'Suite bundle: **1.0.27**')
          text = text.replace('| koz-static-translate | 0.9.36 |', '| koz-static-translate | 0.9.37 |')
          text = text.replace('**KOZ Suite Bundle 1.0.26**', '**KOZ Suite Bundle 1.0.27**')
          text = text.replace('KOZ Suite Hub — Private 0.4.6', 'KOZ Suite Hub — Private 0.4.8')
          readme.write_text(text, encoding='utf-8')
          PY

          cat > RELEASE_NOTES_v1.0.27.md <<'MD'
          # KOZ WordPress Plugin Suite 1.0.27

          This release updates KOZ Static Translate from 0.9.36 to 0.9.37 while keeping the other 11 public plugin packages unchanged.

          ## KOZ Static Translate 0.9.37

          - WordPress.org review remediation: 5/5 complete.
          - Plugin-owned frontend CSS/JS is loaded through WordPress enqueue APIs.
          - Dynamic translation REST writes and Azure calls require an administrator capability and REST nonce.
          - Automatic deactivation of the legacy package was removed.
          - Public source and Azure service terms/privacy documentation were completed.
          - Live regression, WordPress Plugin Check and WordPress 7.1 compatibility: PASS.

          ## Verification

          - Public plugins: 12/12.
          - Other 11 packages: unchanged from KOZ Suite 1.0.26.
          - KOZ Static Translate 0.9.37 SHA-256: `3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb`.
          - KOZ Suite 1.0.27 SHA-256: `1a5a1c297e3f2a124fe6ff915210abd037992e3bfa31014608e03605235eb5a8`.
          MD

          rm -f "$PACKAGE" .release/kozsuite-1.0.27.trigger
          rmdir .release 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Release KOZ Static Translate 0.9.37 and Suite 1.0.27'
            git push origin HEAD:main
          fi
