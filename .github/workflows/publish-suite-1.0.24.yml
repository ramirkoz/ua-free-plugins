name: Publish KOZ Suite 1.0.24

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'koz-suite-1.0.24-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark synchronization start
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p sync
          printf '%s\n' 'KOZ Suite 1.0.24 synchronization workflow started.' > sync/KOZ_SUITE_1.0.24_RUN_STARTED.txt
          git add sync/KOZ_SUITE_1.0.24_RUN_STARTED.txt
          git commit -m 'Mark KOZ Suite 1.0.24 synchronization start'
          git push origin HEAD:main

      - name: Download and verify exact tested bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/koz124 /tmp/koz124-release
          mkdir -p /tmp/koz124 /tmp/koz124-release
          curl -L --fail --retry 3 'https://drive.usercontent.google.com/download?id=1NdMFxHcOdQUV_03EEBR9tyHX7iinkViX&export=download&confirm=t' -o /tmp/KOZ_SUITE_BUNDLE_1.0.24.zip
          echo 'b7768143bbe519c8caefab440894a05c0854392021c139026408d3bd9bb8ff9d  /tmp/KOZ_SUITE_BUNDLE_1.0.24.zip' | sha256sum -c -
          unzip -t /tmp/KOZ_SUITE_BUNDLE_1.0.24.zip >/dev/null
          unzip -q /tmp/KOZ_SUITE_BUNDLE_1.0.24.zip -d /tmp/koz124
          (cd /tmp/koz124 && sha256sum -c SHA256SUMS.txt)

      - name: Synchronize exact public source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil, zipfile

          root=Path('.')
          src=Path('/tmp/koz124')
          versions={
            'koz-migration-cleanup':'0.9.7',
            'koz-static-translate':'0.9.17',
            'koz-translate-diagnostics':'0.3.6',
            'koz-seo-core':'2.1.22',
            'koz-404-guard':'2.1.4',
            'koz-site-bridge':'0.5.6',
            'koz-consent-manager':'0.2.12',
            'koz-donate-stats':'1.3.11',
            'koz-google-ads-campaign-builder':'1.4.13',
            'koz-copy-actions':'1.1.14',
            'koz-url-only-comment-spam':'1.1.11',
            'koz-suite-control-center':'0.4.7',
          }
          for slug,ver in versions.items():
            z=src/'packages'/f'{slug}-{ver}.zip'
            if not z.is_file(): raise SystemExit(f'Missing {z}')
            with zipfile.ZipFile(z) as a:
              roots={PurePosixPath(i.filename).parts[0] for i in a.infolist() if not i.is_dir() and PurePosixPath(i.filename).parts}
              if roots!={slug}: raise SystemExit(f'Bad root {slug}: {roots}')
              for i in a.infolist():
                p=PurePosixPath(i.filename)
                if p.is_absolute() or '..' in p.parts: raise SystemExit(f'Unsafe member {i.filename}')
              shutil.rmtree(root/slug,ignore_errors=True)
              a.extractall(root)

          rel=root/'releases'; rel.mkdir(exist_ok=True)
          shutil.copy2(src/'manifest.json',rel/'KOZ_SUITE_1.0.24_MANIFEST.json')
          shutil.copy2(src/'SHA256SUMS.txt',rel/'KOZ_SUITE_1.0.24_SHA256SUMS.txt')
          (rel/'KOZ_SUITE_1.0.24_TEST_REPORT.md').write_text('''# KOZ Suite 1.0.24 Test Report\n\nStatus: **FINAL — LIVE + WORDPRESS 7.1 + PLUGIN CHECK PASS**\n\n- Public plugins: **12/12 LIVE PASS**.\n- WordPress Plugin Check: **12/12 PASS**.\n- WordPress compatibility: **7.1 PASS**.\n- KOZ Site Bridge 0.5.6 preserves the exact live 0.5.5 functionality.\n- KOZ SEO Core 2.1.22 includes the WordPress.org JSON-output remediation.\n- Private Hub 0.4.6 remains excluded from public GitHub.\n- Bundle and package SHA-256 validation: **PASS**.\n''',encoding='utf-8')
          (rel/'KOZ_SUITE_1.0.24_CHANGELOG.md').write_text('''# KOZ Suite 1.0.24\n\n- Synchronized all 12 public plugins to the verified WordPress 7.1 live baseline.\n- Site Bridge 0.5.6 preserves the exact live 0.5.5 functionality.\n- SEO Core updated to 2.1.22.\n- Copy Actions updated to 1.1.14.\n- URL-Only Comment Spam updated to 1.1.11.\n- Private Hub 0.4.6 remains Drive-only.\n''',encoding='utf-8')
          (root/'RELEASE_NOTES_v1.0.24.md').write_text('''# KOZ WordPress Plugin Suite 1.0.24\n\nWordPress 7.1 maintenance release synchronized from the exact packages verified on the live site.\n\n- 12/12 public plugins LIVE PASS.\n- 12/12 WordPress Plugin Check PASS.\n- Private Hub 0.4.6 remains outside the public repository and release.\n''',encoding='utf-8')
          rows='\n'.join(f'| {s} | {v} |' for s,v in versions.items())
          (root/'README.md').write_text(f'''# KOZ WordPress Plugin Suite\n\nA practical collection of 12 privacy-first WordPress plugins independently maintained by Tony Kozyriev (`ramirkz`).\n\n## Current release status\n\n- Suite bundle: **1.0.24**\n- Public plugins: **12**\n- Live functional baseline: **12/12 PASS**\n- WordPress Plugin Check baseline: **12/12 PASS**\n- WordPress compatibility baseline: **7.1**\n- Private Hub: **KOZ Suite Hub — Private 0.4.6**, live + Plugin Check PASS, intentionally excluded from this public repository and release.\n\n## Included plugins\n\n| Plugin slug | Version |\n|---|---:|\n{rows}\n\n## Current bundle\n\n**KOZ Suite Bundle 1.0.24** contains the exact 12 verified public plugin ZIP packages.\n\n## License\n\nGPL-2.0-or-later.\n''',encoding='utf-8')

          for slug,ver in versions.items():
            text=(root/slug/'readme.txt').read_text(encoding='utf-8')
            if 'Tested up to: 7.1' not in text: raise SystemExit(f'WP 7.1 missing: {slug}')
            if f'Stable tag: {ver}' not in text: raise SystemExit(f'Stable tag mismatch: {slug}')
          if 'JSON_UNESCAPED_SLASHES' in '\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in (root/'koz-seo-core').rglob('*.php')):
            raise SystemExit('SEO JSON remediation missing')
          bridge=(root/'koz-site-bridge'/'includes'/'class-kozbridge-bridge.php').read_text(encoding='utf-8')
          if "'/admin-error-log'" not in bridge: raise SystemExit('Site Bridge live delta missing')

          for p in [root/'sync'/'sitebridge-live-0.5.5.patch',root/'sync'/'KOZ_SUITE_1.0.24_RUN_STARTED.txt',root/'.release-suite-1.0.24.trigger',root/'.github'/'workflows'/'publish-suite-1.0.24.yml']:
            if p.exists(): p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release KOZ Suite 1.0.24 for WordPress 7.1'
          git push origin HEAD:main

      - name: Prepare clean release assets
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/KOZ_SUITE_BUNDLE_1.0.24.zip /tmp/koz124-release/
          cp /tmp/koz124/packages/*.zip /tmp/koz124-release/
          cp releases/KOZ_SUITE_1.0.24_{MANIFEST.json,SHA256SUMS.txt,TEST_REPORT.md,CHANGELOG.md} /tmp/koz124-release/
          printf '%s  %s\n' 'b7768143bbe519c8caefab440894a05c0854392021c139026408d3bd9bb8ff9d' 'KOZ_SUITE_BUNDLE_1.0.24.zip' > /tmp/koz124-release/KOZ_SUITE_BUNDLE_1.0.24.zip.sha256

      - name: Publish clean GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.24 >/dev/null 2>&1; then
            for n in $(gh release view v1.0.24 --json assets --jq '.assets[].name'); do gh release delete-asset v1.0.24 "$n" -y; done
            gh release upload v1.0.24 /tmp/koz124-release/*
            gh release edit v1.0.24 --title 'KOZ WordPress Plugin Suite 1.0.24' --notes-file RELEASE_NOTES_v1.0.24.md
          else
            gh release create v1.0.24 /tmp/koz124-release/* --target main --title 'KOZ WordPress Plugin Suite 1.0.24' --notes-file RELEASE_NOTES_v1.0.24.md
          fi
          gh release view v1.0.24 --json tagName,name,isDraft,isPrerelease,assets

      - name: Close sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr close '${{ github.event.pull_request.number }}' --delete-branch || true
