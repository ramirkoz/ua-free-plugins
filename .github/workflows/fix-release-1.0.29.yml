name: Fix KOZ Suite 1.0.29 Release

on:
  push:
    branches: [main]
    paths: [.fix-release-1.0.29.trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final release checksum and retrigger
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/1808eaf1fd691ea518952801ba1bca193efa25e896befe09c0d8034eee40b885/2a187d85553be0b531f01792f13b74090523306a8dbe743c29af446c2ddfdd52/" .github/workflows/release-kozsuite-1.0.29-final.yml
          printf 'release KOZ Suite 1.0.29 final retry\n' > .release-1.0.29-final.trigger
          rm -f .fix-release-1.0.29.trigger .github/workflows/fix-release-1.0.29.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize KOZ Suite 1.0.29 release checksum'
          git push origin HEAD:main
