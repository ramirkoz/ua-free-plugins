name: Publish Static Translate 0.8.6

on:
  push:
    paths:
      - '.github/workflows/static-translate-0.8.6-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Static Translate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/static-translate-0.8.6.patch.b64.part* > /tmp/static-translate-0.8.6.patch.b64
          base64 -d /tmp/static-translate-0.8.6.patch.b64 > /tmp/static-translate-0.8.6.patch
          echo 'c7dabd6fe170ceefeeb23c4c7115b949511b2b142984e85ac0a299d377f8e1e9  /tmp/static-translate-0.8.6.patch' | sha256sum -c -
          git apply --check --directory=ua-free-static-translate /tmp/static-translate-0.8.6.patch
          git apply --directory=ua-free-static-translate /tmp/static-translate-0.8.6.patch

      - name: Build Static Translate 0.8.6 release and library 2.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUILD'
          from pathlib import Path
          import hashlib, json, re, shutil, subprocess, zipfile

          root = Path('.')
          plugin_dir = root / 'ua-free-static-translate'
          release_dir = root / 'releases'
          release_dir.mkdir(exist_ok=True)

          for php in sorted(plugin_dir.rglob('*.php')):
              result = subprocess.run(['php', '-l', str(php)], capture_output=True, text=True)
              assert result.returncode == 0, result.stdout + result.stderr

          main_source = (plugin_dir / 'ua-free-static-translate.php').read_text(encoding='utf-8')
          readme_source = (plugin_dir / 'readme.txt').read_text(encoding='utf-8')
          assert re.search(r'^ \* Version: 0\.8\.6$', main_source, re.M)
          assert re.search(r'^Stable tag: 0\.8\.6$', readme_source, re.M)
          assert re.search(r'^Tested up to: 7\.0$', readme_source, re.M)
          assert 'load_plugin_textdomain' not in '\n'.join(
              p.read_text(encoding='utf-8') for p in plugin_dir.rglob('*.php')
          )
          assert 'uafree-admin-support-card' in (
              plugin_dir / 'includes/class-uafree-admin-support-footer.php'
          ).read_text(encoding='utf-8')

          release = release_dir / 'ua-free-static-translate-0.8.6.zip'
          fixed_time = (2026, 7, 30, 17, 30, 0)
          with zipfile.ZipFile(release, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in plugin_dir.rglob('*') if p.is_file()):
                  arcname = f'ua-free-static-translate/{path.relative_to(plugin_dir).as_posix()}'
                  info = zipfile.ZipInfo(arcname, date_time=fixed_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes())

          release_sha = hashlib.sha256(release.read_bytes()).hexdigest()
          assert release_sha == 'eef9199e70a176fd22963b85be4b98dd1b86aa9e08e280aa9ec53d34537dea96'
          (release_dir / 'ua-free-static-translate-0.8.6.sha256').write_text(
              f'{release_sha}  releases/ua-free-static-translate-0.8.6.zip\n', encoding='utf-8'
          )
          with zipfile.ZipFile(release) as zf:
              assert zf.testzip() is None
              assert all(name.startswith('ua-free-static-translate/') for name in zf.namelist())

          old_library = release_dir / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip'
          assert old_library.exists()
          work = Path('/tmp/ua-free-library-2.4')
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(old_library) as zf:
              zf.extractall(work)

          old_package = work / 'packages/ua-free-static-translate-v0.8.5.zip'
          if old_package.exists():
              old_package.unlink()
          new_package = work / 'packages/ua-free-static-translate-v0.8.6.zip'
          shutil.copy2(release, new_package)

          manifest_path = work / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '2.4'
          manifest['created'] = '2026-07-30'
          manifest['status'] = 'FINAL'
          static = next(item for item in manifest['packages'] if item['slug'] == 'ua-free-static-translate')
          static.update({
              'version': '0.8.6',
              'file': 'packages/ua-free-static-translate-v0.8.6.zip',
              'sha256': release_sha,
              'size': release.stat().st_size,
          })
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for package in manifest['packages']:
              package_path = work / package['file']
              data = package_path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == package['sha256']
              assert len(data) == package['size']
              with zipfile.ZipFile(package_path) as zf:
                  assert zf.testzip() is None

          library_name = 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.4.zip'
          library = release_dir / library_name
          with zipfile.ZipFile(library, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in [manifest_path] + sorted((work / 'packages').glob('*.zip')):
                  arcname = 'manifest.json' if path == manifest_path else f'packages/{path.name}'
                  info = zipfile.ZipInfo(arcname, date_time=fixed_time)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  zf.writestr(info, path.read_bytes())

          library_sha = hashlib.sha256(library.read_bytes()).hexdigest()
          assert library_sha == '3ad65431d4bc1142cb97285715801c914407345637767b7c85f309560e6f7f75'
          (release_dir / f'{library_name}.sha256').write_text(
              f'{library_sha}  releases/{library_name}\n', encoding='utf-8'
          )
          shutil.copy2(
              manifest_path,
              release_dir / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.4.manifest.json'
          )

          report_lines = [
              '# UA FREE Synchronization Report',
              '',
              '- Date: 2026-07-30',
              '- Library: 2.4',
              '- Status: Static Translate 0.8.6 Plugin Check PASS; package, manifest, ZIP, CRC, SHA-256 and PHP checks PASS.',
              '- Scope: Static Translate updated; other 11 public packages and SHA-256 values preserved.',
              '',
              '| Plugin | Version | SHA-256 |',
              '|---|---:|---|',
          ]
          for package in manifest['packages']:
              report_lines.append(f"| {package['name']} | {package['version']} | `{package['sha256']}` |")
          report_lines += [
              '',
              f'Library SHA-256: `{library_sha}`',
              '',
              'Plugin Check for Static Translate 0.8.6 was confirmed on the live WordPress site by the manager.',
          ]
          (release_dir / 'UA_FREE_SYNC_REPORT_2026-07-30_v2.4.md').write_text(
              '\n'.join(report_lines) + '\n', encoding='utf-8'
          )

          with zipfile.ZipFile(library) as zf:
              assert zf.testzip() is None
              embedded = json.loads(zf.read('manifest.json'))
              assert embedded == manifest
              assert len(embedded['packages']) == 12
              for package in embedded['packages']:
                  data = zf.read(package['file'])
                  assert hashlib.sha256(data).hexdigest() == package['sha256']
                  assert len(data) == package['size']

          for obsolete in [
              release_dir / 'ua-free-static-translate-0.8.5.zip',
              release_dir / 'ua-free-static-translate-0.8.5.sha256',
              release_dir / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip',
              release_dir / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip.sha256',
              release_dir / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.manifest.json',
              release_dir / 'UA_FREE_SYNC_REPORT_2026-07-30_v2.3.md',
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          PYBUILD

      - name: Record synchronization run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_CANONICAL_SYNC_RUN_ID.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-static-translate-0.8.6-library-2.4
          path: |
            releases/ua-free-static-translate-0.8.6.zip
            releases/ua-free-static-translate-0.8.6.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.4.zip
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.4.zip.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.4.manifest.json
            releases/UA_FREE_SYNC_REPORT_2026-07-30_v2.4.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/static-translate-0.8.6.patch.b64.part*
          rm -f .github/workflows/static-translate-0.8.6-sync.yml
          git config user.name 'UA FREE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release Static Translate 0.8.6 and library 2.4'
          git push origin HEAD:main
