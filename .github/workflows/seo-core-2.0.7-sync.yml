name: Publish SEO Core 2.0.7

on:
  push:
    paths:
      - '.github/workflows/seo-core-2.0.7-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified SEO Core package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/ua-free-seo-core-2.0.7.zip \
            'https://drive.usercontent.google.com/download?id=1EFiiZnToRt8BN1Um-DPW_EFMJD4xpipq&export=download&confirm=t'
          echo 'fb7a974169f59bda8407cfdd05684c962f13c7b56b632f6fa2c0d89bb3a9f638  /tmp/ua-free-seo-core-2.0.7.zip' | sha256sum -c -

      - name: Apply plugin source and build library 2.6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ua-free-seo-core
          unzip -q /tmp/ua-free-seo-core-2.0.7.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import hashlib, json, shutil

          root = Path('.')
          releases = root / 'releases'
          old_library = releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.5.zip'
          plugin_zip = Path('/tmp/ua-free-seo-core-2.0.7.zip')
          plugin_sha = hashlib.sha256(plugin_zip.read_bytes()).hexdigest()
          assert plugin_sha == 'fb7a974169f59bda8407cfdd05684c962f13c7b56b632f6fa2c0d89bb3a9f638'

          with ZipFile(old_library) as source:
              manifest = json.loads(source.read('manifest.json'))
              packages = {name: source.read(name) for name in source.namelist() if name.startswith('packages/')}

          manifest['version'] = '2.6'
          manifest['created'] = '2026-07-31'
          manifest['status'] = 'FINAL'
          packages.pop('packages/ua-free-seo-core-v2.0.6.zip', None)
          packages['packages/ua-free-seo-core-v2.0.7.zip'] = plugin_zip.read_bytes()

          for package in manifest['packages']:
              if package['slug'] == 'ua-free-seo-core':
                  package['version'] = '2.0.7'
                  package['file'] = 'packages/ua-free-seo-core-v2.0.7.zip'
                  package['sha256'] = plugin_sha
                  package['size'] = plugin_zip.stat().st_size
                  break
          else:
              raise RuntimeError('SEO Core package missing from manifest')

          for package in manifest['packages']:
              data = packages[package['file']]
              assert hashlib.sha256(data).hexdigest() == package['sha256']
              assert len(data) == package['size']

          manifest_text = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          library_name = 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip'
          library = releases / library_name
          fixed_time = (2026, 7, 31, 8, 25, 0)
          with ZipFile(library, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              info = ZipInfo('manifest.json', fixed_time)
              info.compress_type = ZIP_DEFLATED
              info.external_attr = 0o644 << 16
              archive.writestr(info, manifest_text.encode('utf-8'))
              for package in sorted(manifest['packages'], key=lambda item: item['file']):
                  info = ZipInfo(package['file'], fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, packages[package['file']])

          library_sha = hashlib.sha256(library.read_bytes()).hexdigest()
          assert library_sha == 'fbcdc88c6222cd6d89a3c7025830af799ee9f572d2b8d7954e11377424de4920'

          shutil.copy2(plugin_zip, releases / 'ua-free-seo-core-2.0.7.zip')
          (releases / 'ua-free-seo-core-2.0.7.sha256').write_text(
              plugin_sha + '  ua-free-seo-core-2.0.7.zip\n', encoding='utf-8'
          )
          (releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.manifest.json').write_text(
              manifest_text, encoding='utf-8'
          )
          (releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip.sha256').write_text(
              library_sha + '  ' + library_name + '\n', encoding='utf-8'
          )
          (releases / 'UA_FREE_SYNC_REPORT_2026-07-31_v2.6.md').write_text(
              '# UA FREE Synchronization Report\n\n'
              '- Date: 2026-07-31\n'
              '- Library: 2.6\n'
              '- Status: SEO Core 2.0.7 Plugin Check PASS; package, manifest, ZIP, CRC, SHA-256 and PHP checks PASS.\n'
              '- Scope: SEO Core updated; other 11 public packages and SHA-256 values preserved.\n\n'
              f'Plugin SHA-256: `{plugin_sha}`\n\n'
              f'Library SHA-256: `{library_sha}`\n',
              encoding='utf-8'
          )
          PY
          rm -f releases/ua-free-seo-core-2.0.6.zip
          rm -f releases/ua-free-seo-core-2.0.6.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.5.zip
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.5.zip.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.5.manifest.json
          rm -f releases/UA_FREE_SYNC_REPORT_2026-07-31_v2.5.md

      - name: Validate plugin and library
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 2.0.7$' ua-free-seo-core/ua-free-seo-core.php
          grep -q '^Stable tag: 2.0.7$' ua-free-seo-core/readme.txt
          grep -q '^Tested up to: 7.0$' ua-free-seo-core/readme.txt
          ! grep -R --include='*.php' -n 'load_plugin_textdomain' ua-free-seo-core
          find ua-free-seo-core -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import hashlib, json, pathlib, re, zipfile
          root = pathlib.Path('.')
          release = root / 'releases/ua-free-seo-core-2.0.7.zip'
          assert hashlib.sha256(release.read_bytes()).hexdigest() == 'fb7a974169f59bda8407cfdd05684c962f13c7b56b632f6fa2c0d89bb3a9f638'
          with zipfile.ZipFile(release) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert names and all(name.startswith('ua-free-seo-core/') for name in names)
              main = archive.read('ua-free-seo-core/ua-free-seo-core.php').decode('utf-8')
              readme = archive.read('ua-free-seo-core/readme.txt').decode('utf-8')
              assert re.search(r'^ \* Version: 2\.0\.7$', main, re.M)
              assert re.search(r'^Stable tag: 2\.0\.7$', readme, re.M)
          manifest_path = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '2.6'
          assert manifest['status'] == 'FINAL'
          assert len(manifest['packages']) == 12
          seo = next(item for item in manifest['packages'] if item['slug'] == 'ua-free-seo-core')
          assert seo['version'] == '2.0.7'
          assert seo['sha256'] == 'fb7a974169f59bda8407cfdd05684c962f13c7b56b632f6fa2c0d89bb3a9f638'
          library = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip'
          assert hashlib.sha256(library.read_bytes()).hexdigest() == 'fbcdc88c6222cd6d89a3c7025830af799ee9f572d2b8d7954e11377424de4920'
          with zipfile.ZipFile(library) as archive:
              assert archive.testzip() is None
              embedded = json.loads(archive.read('manifest.json'))
              assert embedded == manifest
              for package in embedded['packages']:
                  data = archive.read(package['file'])
                  assert hashlib.sha256(data).hexdigest() == package['sha256']
                  assert len(data) == package['size']
          PY

      - name: Record synchronization run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_CANONICAL_SYNC_RUN_ID.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-seo-core-2.0.7-library-2.6
          path: |
            releases/ua-free-seo-core-2.0.7.zip
            releases/ua-free-seo-core-2.0.7.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.manifest.json
            releases/UA_FREE_SYNC_REPORT_2026-07-31_v2.6.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seo-core-2.0.7-sync.yml
          git config user.name 'UA FREE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release SEO Core 2.0.7 and library 2.6'
          git push origin HEAD:main
