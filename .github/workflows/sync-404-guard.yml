name: Sync UA FREE 404 Guard

on:
  push:
    paths:
      - '.github/workflows/sync-404-guard.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Plugin Check fixes
        shell: python
        run: |
          from pathlib import Path

          admin = Path('ua-free-404-guard/includes/class-admin.php')
          guard = Path('ua-free-404-guard/includes/class-guard.php')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          text = admin.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "\t\t$deep       = isset( $_GET['uafree_404_deep'] ) && '1' === Guard::scalar_string( wp_unslash( $_GET['uafree_404_deep'] ) );\n\t\tif ( $deep ) {",
              "\t\t$deep_value = '';\n\t\tif ( isset( $_GET['uafree_404_deep'] ) ) {\n\t\t\t$deep_value = sanitize_key( wp_unslash( Guard::scalar_string( $_GET['uafree_404_deep'] ) ) );\n\t\t}\n\t\t$deep = '1' === $deep_value;\n\t\tif ( $deep ) {",
              'deep scan input',
          )
          text = replace_once(
              text,
              "\t\t\t<div class=\"notice notice-warning inline\"><p><?php esc_html_e( 'Development build. It creates no automatic redirect or 410 rules.', 'ua-free-404-guard' ); ?></p></div>",
              "\t\t\t<div class=\"notice notice-info inline\"><p><?php esc_html_e( 'No automatic redirect or 410 rules are created.', 'ua-free-404-guard' ); ?></p></div>",
              'stable notice',
          )
          text = replace_once(
              text,
              "\t\t\t<?php if ( ! empty( $capture['active'] ) ) : ?>\n\t\t\t\t<div class=\"notice notice-info inline\"><p><?php echo esc_html( sprintf( __( 'Capture is active for approximately %1$d more seconds. Requests are sampled 1 in %2$d and the grouped log is written at most once every %3$d seconds.', 'ua-free-404-guard' ), $capture['seconds_remaining'], $capture['sample_denominator'], $capture['write_interval'] ) ); ?></p></div>",
              "\t\t\t<?php if ( ! empty( $capture['active'] ) ) : ?>\n\t\t\t\t<?php\n\t\t\t\t$capture_message = sprintf(\n\t\t\t\t\t/* translators: 1: seconds remaining, 2: sampling denominator, 3: minimum seconds between grouped log writes. */\n\t\t\t\t\t__( 'Capture is active for approximately %1$d more seconds. Requests are sampled 1 in %2$d and the grouped log is written at most once every %3$d seconds.', 'ua-free-404-guard' ),\n\t\t\t\t\t$capture['seconds_remaining'],\n\t\t\t\t\t$capture['sample_denominator'],\n\t\t\t\t\t$capture['write_interval']\n\t\t\t\t);\n\t\t\t\t?>\n\t\t\t\t<div class=\"notice notice-info inline\"><p><?php echo esc_html( $capture_message ); ?></p></div>",
              'capture translators comment',
          )
          text = replace_once(
              text,
              "\t\t\t<?php else : ?>\n\t\t\t\t<p><?php echo esc_html( sprintf( __( 'Checked %1$d posts and %2$d links. Candidates: %3$d.', 'ua-free-404-guard' ), $link_audit['posts_checked'], $link_audit['links_checked'], $link_audit['candidate_count'] ) ); ?></p>\n\t\t\t\t<?php self::candidate_table( $link_audit['items'] ); ?>",
              "\t\t\t<?php else : ?>\n\t\t\t\t<?php\n\t\t\t\t$audit_message = sprintf(\n\t\t\t\t\t/* translators: 1: posts checked, 2: links checked, 3: candidate links found. */\n\t\t\t\t\t__( 'Checked %1$d posts and %2$d links. Candidates: %3$d.', 'ua-free-404-guard' ),\n\t\t\t\t\t$link_audit['posts_checked'],\n\t\t\t\t\t$link_audit['links_checked'],\n\t\t\t\t\t$link_audit['candidate_count']\n\t\t\t\t);\n\t\t\t\t?>\n\t\t\t\t<p><?php echo esc_html( $audit_message ); ?></p>\n\t\t\t\t<?php self::candidate_table( $link_audit['items'] ); ?>",
              'audit translators comment',
          )
          text = replace_once(
              text,
              "\t\t$source = Guard::normalise_path( Guard::scalar_string( wp_unslash( $_POST['source'] ?? '' ) ) );\n\t\t$target = Guard::normalise_same_site_url( wp_unslash( $_POST['target'] ?? '' ) );\n\t\t$status = absint( Guard::scalar_string( $_POST['status'] ?? 301 ) );",
              "\t\t$source_raw = isset( $_POST['source'] )\n\t\t\t? sanitize_text_field( wp_unslash( Guard::scalar_string( $_POST['source'] ) ) )\n\t\t\t: '';\n\t\t$target_raw = isset( $_POST['target'] )\n\t\t\t? sanitize_text_field( wp_unslash( Guard::scalar_string( $_POST['target'] ) ) )\n\t\t\t: '';\n\t\t$status = isset( $_POST['status'] )\n\t\t\t? absint( wp_unslash( Guard::scalar_string( $_POST['status'] ) ) )\n\t\t\t: 301;\n\t\t$source = Guard::normalise_path( $source_raw );\n\t\t$target = Guard::normalise_same_site_url( $target_raw );",
              'redirect inputs',
          )
          old_id = "\t\t$id = sanitize_text_field( Guard::scalar_string( wp_unslash( $_GET['id'] ?? '' ) ) );"
          new_id = "\t\t$id = isset( $_GET['id'] )\n\t\t\t? sanitize_text_field( wp_unslash( Guard::scalar_string( $_GET['id'] ) ) )\n\t\t\t: '';"
          if text.count(old_id) != 2:
              raise SystemExit(f'delete IDs: expected two matches, found {text.count(old_id)}')
          text = text.replace(old_id, new_id)
          text = replace_once(
              text,
              "\t\t$type  = sanitize_key( Guard::scalar_string( wp_unslash( $_POST['type'] ?? '' ) ) );\n\t\t$value = Guard::normalise_gone_value( $type, wp_unslash( $_POST['value'] ?? '' ) );",
              "\t\t$type = isset( $_POST['type'] )\n\t\t\t? sanitize_key( wp_unslash( Guard::scalar_string( $_POST['type'] ) ) )\n\t\t\t: '';\n\t\t$value_raw = isset( $_POST['value'] )\n\t\t\t? sanitize_text_field( wp_unslash( Guard::scalar_string( $_POST['value'] ) ) )\n\t\t\t: '';\n\t\t$value = Guard::normalise_gone_value( $type, $value_raw );",
              '410 inputs',
          )
          text = replace_once(
              text,
              "\tprivate static function render_notice(): void {\n\t\t$code = sanitize_key( Guard::scalar_string( wp_unslash( $_GET['uafree_notice'] ?? '' ) ) );",
              "\tprivate static function render_notice(): void {\n\t\t$code = '';\n\t\tif ( isset( $_GET['uafree_notice'] ) ) {\n\t\t\t// phpcs:ignore WordPress.Security.NonceVerification.Recommended -- Read-only admin notice; no state is changed.\n\t\t\t$code = sanitize_key( wp_unslash( Guard::scalar_string( $_GET['uafree_notice'] ) ) );\n\t\t}",
              'admin notice',
          )
          admin.write_text(text, encoding='utf-8')

          text = guard.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "\tpublic static function request_uri(): string {\n\t\t$uri = self::scalar_string( $_SERVER['REQUEST_URI'] ?? '/' );\n\t\t$uri = wp_unslash( $uri );\n\t\t$uri = preg_replace( '/[\\x00-\\x1F\\x7F].*$/s', '', $uri ) ?? '/';",
              "\tpublic static function request_uri(): string {\n\t\t$uri = isset( $_SERVER['REQUEST_URI'] )\n\t\t\t? sanitize_text_field( wp_unslash( self::scalar_string( $_SERVER['REQUEST_URI'] ) ) )\n\t\t\t: '/';\n\t\t$uri = preg_replace( '/[\\x00-\\x1F\\x7F].*$/s', '', $uri ) ?? '/';",
              'request URI',
          )
          text = replace_once(
              text,
              "\tpublic static function user_agent(): string {\n\t\t$ua = self::scalar_string( $_SERVER['HTTP_USER_AGENT'] ?? '' );\n\t\t$ua = sanitize_text_field( wp_unslash( $ua ) );",
              "\tpublic static function user_agent(): string {\n\t\t$ua = isset( $_SERVER['HTTP_USER_AGENT'] )\n\t\t\t? sanitize_text_field( wp_unslash( self::scalar_string( $_SERVER['HTTP_USER_AGENT'] ) ) )\n\t\t\t: '';",
              'user agent',
          )
          text = replace_once(
              text,
              "\t\t$referrer         = self::referrer_summary( self::scalar_string( $_SERVER['HTTP_REFERER'] ?? '' ) );",
              "\t\t$referrer_raw = isset( $_SERVER['HTTP_REFERER'] )\n\t\t\t? esc_url_raw( wp_unslash( self::scalar_string( $_SERVER['HTTP_REFERER'] ) ) )\n\t\t\t: '';\n\t\t$referrer = self::referrer_summary( $referrer_raw );",
              'referrer',
          )
          text = replace_once(
              text,
              "\t\tglobal $wpdb;\n\t\tif ( ! is_object( $wpdb ) || empty( $wpdb->options ) || ! method_exists( $wpdb, 'prepare' ) || ! method_exists( $wpdb, 'query' ) || ! function_exists( 'maybe_serialize' ) ) {\n\t\t\treturn false;\n\t\t}\n\t\t$old_serialized = maybe_serialize( $current );\n\t\t$new_serialized = maybe_serialize( $bucket );\n\t\t$sql = $wpdb->prepare(\n\t\t\t\"UPDATE {$wpdb->options} SET option_value = %s WHERE option_name = %s AND option_value = %s\",\n\t\t\t$new_serialized,\n\t\t\tself::CAPTURE_LOCK_OPTION,\n\t\t\t$old_serialized\n\t\t);\n\t\t$updated = (int) $wpdb->query( $sql );",
              "\t\tglobal $wpdb;\n\t\tif ( ! is_object( $wpdb ) || empty( $wpdb->options ) || ! method_exists( $wpdb, 'update' ) || ! function_exists( 'maybe_serialize' ) ) {\n\t\t\treturn false;\n\t\t}\n\t\t$old_serialized = maybe_serialize( $current );\n\t\t$new_serialized = maybe_serialize( $bucket );\n\t\t// phpcs:ignore WordPress.DB.DirectDatabaseQuery.DirectQuery, WordPress.DB.DirectDatabaseQuery.NoCaching -- Atomic compare-and-swap prevents concurrent capture writes.\n\t\t$updated = (int) $wpdb->update(\n\t\t\t$wpdb->options,\n\t\t\tarray( 'option_value' => $new_serialized ),\n\t\t\tarray(\n\t\t\t\t'option_name'  => self::CAPTURE_LOCK_OPTION,\n\t\t\t\t'option_value' => $old_serialized,\n\t\t\t),\n\t\t\tarray( '%s' ),\n\t\t\tarray( '%s', '%s' )\n\t\t);",
              'atomic database update',
          )
          text = replace_once(text, "\t\t$home = esc_url( home_url( '/' ) );", "\t\t$home = home_url( '/' );", 'home URL assignment')
          text = replace_once(
              text,
              "\t\techo '<body><main><h1>' . esc_html( (string) $status ) . '</h1><p>' . esc_html( $message ) . '</p><a href=\"' . $home . '\">' . esc_html__( 'Return to the homepage', 'ua-free-404-guard' ) . '</a></main></body></html>';",
              "\t\techo '<body><main><h1>' . esc_html( (string) $status ) . '</h1><p>' . esc_html( $message ) . '</p><a href=\"' . esc_url( $home ) . '\">' . esc_html__( 'Return to the homepage', 'ua-free-404-guard' ) . '</a></main></body></html>';",
              'home URL output',
          )
          guard.write_text(text, encoding='utf-8')

          checks = {
              'admin translators': admin.read_text(encoding='utf-8').count('/* translators:') >= 2,
              'admin development notice removed': 'Development build.' not in admin.read_text(encoding='utf-8'),
              'guard direct SQL variable removed': '$wpdb->query( $sql )' not in guard.read_text(encoding='utf-8'),
              'guard atomic update present': '$wpdb->update(' in guard.read_text(encoding='utf-8'),
              'guard escaped home URL': 'esc_url( $home )' in guard.read_text(encoding='utf-8'),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))

      - name: Commit synchronized sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ua-free-404-guard/includes/class-admin.php ua-free-404-guard/includes/class-guard.php
          git rm .github/workflows/sync-404-guard.yml
          git commit -m "Fix UA FREE 404 Guard Plugin Check findings"
          git push origin HEAD:main
