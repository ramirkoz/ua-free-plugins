name: Publish KOZ Suite 1.0.26

on:
  push:
    branches:
      - main
    paths:
      - .release-v1.0.26.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested Static Translate 0.9.36 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/koz-static.patch.gz.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/koz-static.patch.gz.b64 | gzip -d > /tmp/koz-static.patch
          git apply --check /tmp/koz-static.patch
          git apply /tmp/koz-static.patch
          grep -q 'Version: 0.9.36' koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.36' koz-static-translate/readme.txt

      - name: Update suite metadata and release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Suite bundle: **1.0.25**','Suite bundle: **1.0.26**')
          s=s.replace('| koz-static-translate | 0.9.19 |','| koz-static-translate | 0.9.36 |')
          s=s.replace('**KOZ Suite Bundle 1.0.25**','**KOZ Suite Bundle 1.0.26**')
          p.write_text(s,encoding='utf-8')
          PY
          cat > RELEASE_NOTES_v1.0.26.md <<'MD'
          # KOZ WordPress Plugin Suite 1.0.26

          This release updates KOZ Static Translate from 0.9.19 to 0.9.36 while keeping the other 11 public plugin packages unchanged.

          ## KOZ Static Translate 0.9.36

          - Production safety mode prevents heavy activation, automatic worker, cron, bulk rebuild and Azure work during readiness recovery.
          - Priority Core detection is universal and derived dynamically from WordPress navigation, with external URLs excluded and no site-specific hardcoding.
          - Bounded local readiness tools use existing Translation Memory without Azure requests.
          - Description metadata and image alt text are non-blocking for page readiness while remaining available for later translation.
          - Live functional verification, WordPress Plugin Check and WordPress 7.1 compatibility: PASS.
          - Google Search Console live test confirmed a recovered English route is indexable.

          ## Suite verification

          - Public plugins: 12/12.
          - Other 11 packages: byte-identical to KOZ Suite 1.0.25.
          - Release bundle and component checksums are verified before publication.
          MD

      - name: Build exact tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-build /tmp/koz-base /tmp/koz-suite
          mkdir -p dist-build /tmp/koz-base /tmp/koz-suite
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          src=Path('koz-static-translate')
          out=Path('dist-build/KOZ-Static-Translate-0.9.36.zip')
          fixed=(2026,8,24,0,0,0)
          with zipfile.ZipFile(out,'w') as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  arc=f'koz-static-translate/{p.relative_to(src).as_posix()}'
                  info=zipfile.ZipInfo(arc,fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          expected='de2a2190b00dfc5b176d918cff3ac9e9a61dab3e6bca2921f615b66d82fae8e9'
          if h != expected:
              raise SystemExit(f'Static Translate SHA mismatch: {h} != {expected}')
          Path('dist-build/KOZ-Static-Translate-0.9.36.zip.sha256').write_text(f'{h}  KOZ-Static-Translate-0.9.36.zip\n',encoding='utf-8')
          PY
          gh release download v1.0.25 --pattern 'KOZ-Suite-1.0.25.zip' --dir /tmp/koz-base
          unzip -q /tmp/koz-base/KOZ-Suite-1.0.25.zip -d /tmp/koz-suite
          rm -f /tmp/koz-suite/packages/koz-static-translate-0.9.19.zip
          rm -f /tmp/koz-suite/checksums/koz-static-translate-0.9.19.zip.sha256
          cp dist-build/KOZ-Static-Translate-0.9.36.zip /tmp/koz-suite/packages/koz-static-translate-0.9.36.zip
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, zipfile
          root=Path('/tmp/koz-suite')
          packages=root/'packages'
          checksums=root/'checksums'
          static=packages/'koz-static-translate-0.9.36.zip'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          static_sha=sha(static)
          (checksums/'koz-static-translate-0.9.36.zip.sha256').write_text(f'{static_sha}  packages/koz-static-translate-0.9.36.zip\n',encoding='utf-8')
          mp=root/'manifest.json'
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['version']='1.0.26'; m['suite_version']='1.0.26'; m['created']='2026-08-24'; m['release_date']='2026-08-24'
          m['status']='CURRENT LIBRARY — 12/12 LIVE + PLUGIN CHECK PASS — WORDPRESS 7.1'
          for item in m.get('changed_components',[]):
              if item.get('name')=='KOZ Static Translate':
                  item.update(version='0.9.36',sha256=static_sha,live='PASS',plugin_check='PASS',wordpress_7_1='PASS')
          for item in m.get('packages',[]):
              if item.get('slug')=='koz-static-translate':
                  item.update(version='0.9.36',file='packages/koz-static-translate-0.9.36.zip',sha256=static_sha,size=static.stat().st_size,strict_re_audit='PASS',live_functional='PASS',plugin_check='PASS',wordpress_org_ready='YES',wordpress_core_tested='7.1 PASS',wordpress_org_status='0.9.36 READY FOR PENDING WORDPRESS.ORG APPLICATION UPDATE')
          m.setdefault('wordpress_org',{})['koz-static-translate']='0.9.36 READY FOR PENDING APPLICATION UPDATE'
          m.pop('changes_from_1_0_24',None)
          m['changes_from_1_0_25']=[
              'KOZ Static Translate updated from 0.9.19 to 0.9.36.',
              'Production safety mode prevents heavy activation, automatic worker, cron, bulk rebuild and Azure work during readiness recovery.',
              'Priority Core detection is universal and derived dynamically from WordPress navigation, with external URLs excluded and no UA FREE-specific hardcoding.',
              'Local bounded readiness tools use existing Translation Memory without Azure requests; verified live on priority core routes.',
              'Readiness no longer blocks on universal ancillary metadata types such as description metadata and image alt text.',
              'KOZ Static Translate 0.9.36 passed live functional verification and WordPress Plugin Check on WordPress 7.1.',
              'Google Search Console live test confirmed an English ready route is indexable after readiness recovery.',
              'All other 11 public packages remain byte-identical to KOZ Suite 1.0.25.'
          ]
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          lines=[]
          for p in sorted(packages.glob('*.zip')):
              lines.append(f'{sha(p)}  packages/{p.name}')
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          out=Path('dist-build/KOZ-Suite-1.0.26.zip')
          fixed=(2026,8,24,0,0,0)
          with zipfile.ZipFile(out,'w') as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  arc=p.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(arc,fixed)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          suite_sha=sha(out)
          expected='b4a41f77b01d61d4fe43ebbc32a00180613dd97f9e3bd013c24b2aaa6a75c2c5'
          if suite_sha != expected:
              raise SystemExit(f'Suite SHA mismatch: {suite_sha} != {expected}')
          Path('dist-build/KOZ-Suite-1.0.26.zip.sha256').write_text(f'{suite_sha}  KOZ-Suite-1.0.26.zip\n',encoding='utf-8')
          Path('dist/manifest.json').write_bytes(mp.read_bytes())
          PY
          unzip -t dist-build/KOZ-Static-Translate-0.9.36.zip
          unzip -t dist-build/KOZ-Suite-1.0.26.zip

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koz-static-translate README.md RELEASE_NOTES_v1.0.26.md dist/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Release KOZ Suite 1.0.26 with Static Translate 0.9.36'
            git push origin HEAD:main
          fi

      - name: Create GitHub release v1.0.26
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          if gh release view v1.0.26 >/dev/null 2>&1; then
            gh release upload v1.0.26 dist-build/* --clobber
            gh release edit v1.0.26 --title 'KOZ WordPress Plugin Suite 1.0.26' --notes-file RELEASE_NOTES_v1.0.26.md
          else
            gh release create v1.0.26 dist-build/* \
              --target "$target_sha" \
              --title 'KOZ WordPress Plugin Suite 1.0.26' \
              --notes-file RELEASE_NOTES_v1.0.26.md
          fi
          gh release view v1.0.26 --json tagName,name,isDraft,isPrerelease,assets
