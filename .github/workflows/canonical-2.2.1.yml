name: Build canonical UA FREE library 2.2.1

on:
  push:
    paths:
      - '.github/workflows/canonical-2.2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext >/dev/null
          base64 -d .github/canonical-2.2.1.py.gz.b64 | gzip -d > /tmp/canonical_221.py

      - name: Build and validate canonical library 2.2.1
        shell: bash
        run: python3 /tmp/canonical_221.py

      - name: Record workflow run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_CANONICAL_SYNC_RUN_ID.txt

      - name: Upload canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-canonical-2026-07-30-v2.2.1
          path: /tmp/ua-free-canonical-221-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical repository state
        shell: bash
        run: |
          rm -f .github/canonical-2.2.1.py.gz.b64
          rm -f .github/workflows/canonical-2.2.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish canonical UA FREE library 2.2.1'
          git push
