name: Canonicalize KOZ Suite 1.0.30 artifacts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/canonicalize-v1.0.30.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1QEiccXNFWOaPoQvx86-7HzmVA4mswRWd&export=download&confirm=t' \
            -o /tmp/KOZ-Suite-1.0.30.zip
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1S-yEIc1AXDSm_pvjt5J8EvDtpFHWI3Ek&export=download&confirm=t' \
            -o /tmp/KOZ-WordPress.org-Package-Set-1.0.6.zip
          echo '689fa50a8a44db74c544e4adb31a43ae840ffa178c651b149dd5cc2d9a35ec02  /tmp/KOZ-Suite-1.0.30.zip' | sha256sum -c -
          echo 'bb7b60f576cd268fecfb8e17f49bd4accf209b5ed03b42cabe3e0ce9af7b4391  /tmp/KOZ-WordPress.org-Package-Set-1.0.6.zip' | sha256sum -c -
          unzip -t /tmp/KOZ-Suite-1.0.30.zip
          unzip -t /tmp/KOZ-WordPress.org-Package-Set-1.0.6.zip

      - name: Replace repository current artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/KOZ-Suite-1.0.30.zip dist/KOZ-Suite-1.0.30.zip
          printf '%s  %s\n' \
            '689fa50a8a44db74c544e4adb31a43ae840ffa178c651b149dd5cc2d9a35ec02' \
            'KOZ-Suite-1.0.30.zip' > dist/KOZ-Suite-1.0.30.zip.sha256
          cp /tmp/KOZ-WordPress.org-Package-Set-1.0.6.zip dist/KOZ-WordPress.org-Package-Set-1.0.6.zip
          printf '%s  %s\n' \
            'bb7b60f576cd268fecfb8e17f49bd4accf209b5ed03b42cabe3e0ce9af7b4391' \
            'KOZ-WordPress.org-Package-Set-1.0.6.zip' > dist/KOZ-WordPress.org-Package-Set-1.0.6.zip.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/KOZ-Suite-1.0.30.zip dist/KOZ-Suite-1.0.30.zip.sha256 \
                  dist/KOZ-WordPress.org-Package-Set-1.0.6.zip dist/KOZ-WordPress.org-Package-Set-1.0.6.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Canonicalize KOZ Suite 1.0.30 binary artifacts'
            git push origin HEAD:main
          fi

      - name: Refresh GitHub release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.0.30 \
            /tmp/KOZ-Suite-1.0.30.zip \
            /tmp/KOZ-WordPress.org-Package-Set-1.0.6.zip \
            --clobber
