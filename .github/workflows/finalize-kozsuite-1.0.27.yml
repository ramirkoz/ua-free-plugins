name: Finalize KOZ Suite 1.0.27

on:
  push:
    branches: [main]
    paths: [.release/finalize-trigger]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize verified release
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/finalize-trigger
          test "$(wc -c < .release/parts/kozstx-0.9.37.part-11)" -eq 19000
          test "$(git hash-object .release/parts/kozstx-0.9.37.part-11)" = '7595d3517217cbff12d516a0f333b951b92b3276'
          shopt -s nullglob
          PARTS=(.release/parts/kozstx-0.9.37.part-[0-9][0-9])
          test "${#PARTS[@]}" -eq 15
          cat "${PARTS[@]}" > /tmp/kozstx.b64
          base64 --decode /tmp/kozstx.b64 > /tmp/KOZ-Static-Translate-0.9.37.zip
          echo '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb  /tmp/KOZ-Static-Translate-0.9.37.zip' | sha256sum -c -
          unzip -tq /tmp/KOZ-Static-Translate-0.9.37.zip
          rm -rf /tmp/kozstx && mkdir -p /tmp/kozstx
          unzip -q /tmp/KOZ-Static-Translate-0.9.37.zip -d /tmp/kozstx
          test "$(find /tmp/kozstx/koz-static-translate -type f | wc -l)" -eq 28
          grep -q 'Version: 0.9.37' /tmp/kozstx/koz-static-translate/koz-static-translate.php
          grep -q "define( 'KOZSTX_VERSION', '0.9.37' )" /tmp/kozstx/koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.37' /tmp/kozstx/koz-static-translate/readme.txt
          grep -q "return current_user_can( 'manage_options' );" /tmp/kozstx/koz-static-translate/includes/class-kozstx-static-translate.php
          ! grep -R "permission_callback.*__return_true" /tmp/kozstx/koz-static-translate --include='*.php'
          ! grep -R "deactivate_plugins" /tmp/kozstx/koz-static-translate --include='*.php'
          rm -rf koz-static-translate
          cp -a /tmp/kozstx/koz-static-translate ./koz-static-translate
          mkdir -p dist/packages dist/checksums
          cp /tmp/KOZ-Static-Translate-0.9.37.zip dist/packages/koz-static-translate-0.9.37.zip
          printf '%s  %s\n' '3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb' 'koz-static-translate-0.9.37.zip' > dist/checksums/koz-static-translate-0.9.37.zip.sha256
          rm -f dist/packages/koz-static-translate-0.9.36.zip dist/checksums/koz-static-translate-0.9.36.zip.sha256
          python3 - <<'PY'
          import json
          d=json.load(open('dist/manifest.json',encoding='utf-8'))
          assert d['version']=='1.0.27' and d['suite_version']=='1.0.27'
          p=next(x for x in d['packages'] if x['slug']=='koz-static-translate')
          assert p['version']=='0.9.37' and p['sha256']=='3719698eb7cc4015871074f4d9ddadcd45d6e80ba05818f9e14ff733a23706fb'
          PY
          grep -q 'Suite bundle: \*\*1.0.27\*\*' README.md
          grep -q '| koz-static-translate | 0.9.37 |' README.md
          rm -rf .release
          rm -f .github/workflows/publish-kozsuite-1.0.27.yml
          rm -f .github/workflows/finalize-kozsuite-1.0.27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize KOZ Static Translate 0.9.37 and Suite 1.0.27'
          git push origin HEAD:main
