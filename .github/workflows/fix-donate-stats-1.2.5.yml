name: Fix UA FREE Donate Stats 1.2.5

on:
  push:
    paths:
      - '.github/workflows/fix-donate-stats-1.2.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Plugin Check fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("ua-free-donate-stats")

          def read(rel):
              return (root / rel).read_text(encoding="utf-8")

          def write(rel, text):
              (root / rel).write_text(text, encoding="utf-8", newline="\n")

          def replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected source fragment: {label}")
              return text.replace(old, new)

          main = read("ua-free-donate-stats.php")
          main = replace(main, " * Version: 1.2.4", " * Version: 1.2.5", "main header version")
          main = replace(main, " * Requires at least: 6.0", " * Requires at least: 6.2", "main requires")
          main = replace(main, "define( 'UAFREE_DONATE_STATS_VERSION', '1.2.4' );", "define( 'UAFREE_DONATE_STATS_VERSION', '1.2.5' );", "main constant")
          write("ua-free-donate-stats.php", main)

          readme = read("readme.txt")
          readme = replace(readme, "Requires at least: 6.0", "Requires at least: 6.2", "readme requires")
          readme = replace(readme, "Tested up to: 7.0.2", "Tested up to: 7.0", "readme tested")
          readme = replace(readme, "Stable tag: 1.2.4", "Stable tag: 1.2.5", "readme stable")
          readme = readme.replace(
              "== Changelog ==\n\n= 1.2.4 =",
              "== Changelog ==\n\n= 1.2.5 =\n"
              "* Prepared every dynamic table identifier with the WordPress %i placeholder.\n"
              "* Added explicit handling for legitimate direct queries against plugin-owned aggregate tables.\n"
              "* Sanitized request metadata, clarified read-only admin routing, and removed discouraged textdomain loading.\n"
              "* Fixed CSV streaming and translator comments; cleaned the WordPress.org package.\n\n"
              "= 1.2.4 ="
          )
          readme = readme.replace(
              "== Upgrade Notice ==\n\n= 1.2.4 =",
              "== Upgrade Notice ==\n\n= 1.2.5 =\nSecurity and Plugin Check compatibility cleanup without changing stored statistics.\n\n= 1.2.4 ="
          )
          write("readme.txt", readme)

          changelog = read("CHANGELOG.md")
          if "## 1.2.5" not in changelog:
              changelog = (
                  "# Changelog\n\n"
                  "## 1.2.5\n\n"
                  "- Prepared dynamic database identifiers with `%i` and documented legitimate plugin-table queries.\n"
                  "- Sanitized request metadata and clarified nonce handling for read-only admin filters.\n"
                  "- Fixed CSV streaming, translator comments, WordPress metadata and package contents.\n\n"
                  + changelog.replace("# Changelog\n\n", "", 1)
              )
          write("CHANGELOG.md", changelog)

          migration = root / "MIGRATION-NOTES.md"
          if migration.exists():
              migration.unlink()

          plugin = read("includes/class-plugin.php")
          plugin = replace(plugin, "\t\tadd_action( 'plugins_loaded', array( __CLASS__, 'load_textdomain' ) );\n", "", "textdomain hook")
          plugin = replace(
              plugin,
              "\n\tpublic static function load_textdomain(): void {\n"
              "\t\tload_plugin_textdomain(\n"
              "\t\t\t'ua-free-donate-stats',\n"
              "\t\t\tfalse,\n"
              "\t\t\tdirname( plugin_basename( UAFREE_DONATE_STATS_FILE ) ) . '/languages'\n"
              "\t\t);\n"
              "\t}\n",
              "",
              "textdomain method"
          )
          write("includes/class-plugin.php", plugin)

          admin = read("includes/class-admin.php")
          admin = replace(
              admin,
              "\t\t$tab = isset( $_GET['tab'] ) ? sanitize_key( wp_unslash( $_GET['tab'] ) ) : 'overview';",
              "\t\t// phpcs:ignore WordPress.Security.NonceVerification.Recommended -- Read-only tab selection.\n"
              "\t\t$tab = isset( $_GET['tab'] ) ? sanitize_key( wp_unslash( $_GET['tab'] ) ) : 'overview';",
              "admin tab nonce"
          )
          admin = admin.replace(
              "\t\t$days = isset( $_GET['days'] ) ? absint( $_GET['days'] ) : 30;",
              "\t\t// phpcs:ignore WordPress.Security.NonceVerification.Recommended -- Read-only report range.\n"
              "\t\t$days = isset( $_GET['days'] ) ? absint( $_GET['days'] ) : 30;"
          )
          admin = replace(
              admin,
              "\t\t\t\t<p><?php echo esc_html( sprintf( __( 'Останнє підтвердження: %s', 'ua-free-donate-stats' ), (string) $manager['last_confirmation_at'] ) ); ?></p>",
              "\t\t\t\t<p><?php\n"
              "\t\t\t\t\t/* translators: %s: date and time of the latest confirmed donation. */\n"
              "\t\t\t\t\techo esc_html( sprintf( __( 'Останнє підтвердження: %s', 'ua-free-donate-stats' ), (string) $manager['last_confirmation_at'] ) );\n"
              "\t\t\t\t?></p>",
              "confirmation translator"
          )
          admin = replace(
              admin,
              "\t\t\t\t\t\t<?php echo esc_html( sprintf( __( '%d days', 'ua-free-donate-stats' ), $range ) ); ?>",
              "\t\t\t\t\t\t<?php\n"
              "\t\t\t\t\t\t\t/* translators: %d: report period in days. */\n"
              "\t\t\t\t\t\t\techo esc_html( sprintf( __( '%d days', 'ua-free-donate-stats' ), $range ) );\n"
              "\t\t\t\t\t\t?>",
              "days translator"
          )
          admin = replace(
              admin,
              "\t\t\t\t\t<span><?php echo esc_html( sprintf( __( 'Type %s to confirm', 'ua-free-donate-stats' ), Plugin::RESET_PHRASE ) ); ?></span>",
              "\t\t\t\t\t<span><?php\n"
              "\t\t\t\t\t\t/* translators: %s: confirmation phrase required before deleting statistics. */\n"
              "\t\t\t\t\t\techo esc_html( sprintf( __( 'Type %s to confirm', 'ua-free-donate-stats' ), Plugin::RESET_PHRASE ) );\n"
              "\t\t\t\t\t?></span>",
              "reset translator"
          )
          admin = replace(admin, "\t\tfwrite( $output, \"\\xEF\\xBB\\xBF\" );", "\t\techo \"\\xEF\\xBB\\xBF\";", "csv bom")
          admin = replace(admin, "\t\tfclose( $output );\n", "", "csv close")
          write("includes/class-admin.php", admin)

          footer = read("includes/class-uafree-admin-support-footer.php")
          footer = replace(
              footer,
              "\t\t\t$page = isset( $_GET['page'] )",
              "\t\t\t// phpcs:ignore WordPress.Security.NonceVerification.Recommended -- Read-only admin screen detection.\n"
              "\t\t\t$page = isset( $_GET['page'] )",
              "footer page nonce"
          )
          write("includes/class-uafree-admin-support-footer.php", footer)

          tracker = read("includes/class-tracker.php")
          tracker = replace(
              tracker,
              "\t\t$uri = isset( $_SERVER['REQUEST_URI'] ) ? wp_unslash( (string) $_SERVER['REQUEST_URI'] ) : '/';",
              "\t\t$uri = isset( $_SERVER['REQUEST_URI'] )\n"
              "\t\t\t? sanitize_text_field( wp_unslash( (string) $_SERVER['REQUEST_URI'] ) )\n"
              "\t\t\t: '/';",
              "request uri sanitation"
          )
          tracker = replace(
              tracker,
              "\t\t$remote_address = isset( $_SERVER['REMOTE_ADDR'] )\n"
              "\t\t\t? wp_unslash( (string) $_SERVER['REMOTE_ADDR'] )\n"
              "\t\t\t: 'unknown';",
              "\t\t$remote_address = isset( $_SERVER['REMOTE_ADDR'] )\n"
              "\t\t\t? sanitize_text_field( wp_unslash( (string) $_SERVER['REMOTE_ADDR'] ) )\n"
              "\t\t\t: 'unknown';",
              "remote address sanitation"
          )
          tracker = replace(
              tracker,
              "\t\t$purpose = strtolower(\n"
              "\t\t\t(string) (\n"
              "\t\t\t\t$_SERVER['HTTP_PURPOSE']\n"
              "\t\t\t\t?? $_SERVER['HTTP_SEC_PURPOSE']\n"
              "\t\t\t\t?? $_SERVER['HTTP_X_PURPOSE']\n"
              "\t\t\t\t?? ''\n"
              "\t\t\t)\n"
              "\t\t);",
              "\t\t$purpose_header = $_SERVER['HTTP_PURPOSE']\n"
              "\t\t\t?? $_SERVER['HTTP_SEC_PURPOSE']\n"
              "\t\t\t?? $_SERVER['HTTP_X_PURPOSE']\n"
              "\t\t\t?? '';\n"
              "\t\t$purpose = strtolower( sanitize_text_field( wp_unslash( (string) $purpose_header ) ) );",
              "purpose sanitation"
          )
          tracker = replace(
              tracker,
              "\t\t$user_agent = strtolower( (string) ( $_SERVER['HTTP_USER_AGENT'] ?? '' ) );",
              "\t\t$user_agent = isset( $_SERVER['HTTP_USER_AGENT'] )\n"
              "\t\t\t? strtolower( sanitize_text_field( wp_unslash( (string) $_SERVER['HTTP_USER_AGENT'] ) ) )\n"
              "\t\t\t: '';",
              "user agent sanitation"
          )
          write("includes/class-tracker.php", tracker)

          storage = read("includes/class-storage.php")
          storage = replace(
              storage,
              "if ( ! defined( 'ABSPATH' ) ) {\n\texit;\n}\n",
              "if ( ! defined( 'ABSPATH' ) ) {\n\texit;\n}\n\n"
              "/**\n"
              " * Plugin-owned aggregate tables require direct queries for atomic counters and reports.\n"
              " */\n"
              "// phpcs:disable WordPress.DB.DirectDatabaseQuery.DirectQuery, WordPress.DB.DirectDatabaseQuery.NoCaching, WordPress.DB.DirectDatabaseQuery.SchemaChange\n",
              "storage phpcs rationale"
          )

          direct = [
              ("\t\t\t$wpdb->query( \"ALTER TABLE `\" . self::$daily_table . \"` DROP INDEX `event_bucket`\" );", "\t\t\t$wpdb->query( $wpdb->prepare( 'ALTER TABLE %i DROP INDEX `event_bucket`', self::$daily_table ) );", "drop daily index"),
              ("\t\t\t$wpdb->query( \"ALTER TABLE `\" . self::$sessions_table . \"` DROP INDEX `daily_language_session`\" );", "\t\t\t$wpdb->query( $wpdb->prepare( 'ALTER TABLE %i DROP INDEX `daily_language_session`', self::$sessions_table ) );", "drop session index"),
              ("\t\t\t$wpdb->query(\n\t\t\t\t\"ALTER TABLE `\" . self::$daily_table . \"`\n\t\t\t\tADD UNIQUE KEY `event_bucket_v2`\n\t\t\t\t(`stat_date`,`language`,`context_key`,`event_type`,`target_key`)\"\n\t\t\t);", "\t\t\t$wpdb->query(\n\t\t\t\t$wpdb->prepare(\n\t\t\t\t\t'ALTER TABLE %i ADD UNIQUE KEY `event_bucket_v2` (`stat_date`,`language`,`context_key`,`event_type`,`target_key`)',\n\t\t\t\t\tself::$daily_table\n\t\t\t\t)\n\t\t\t);", "add daily index"),
              ("\t\t\t$wpdb->query(\n\t\t\t\t\"ALTER TABLE `\" . self::$sessions_table . \"`\n\t\t\t\tADD UNIQUE KEY `daily_language_context_session`\n\t\t\t\t(`stat_date`,`language`,`context_key`,`session_hash`)\"\n\t\t\t);", "\t\t\t$wpdb->query(\n\t\t\t\t$wpdb->prepare(\n\t\t\t\t\t'ALTER TABLE %i ADD UNIQUE KEY `daily_language_context_session` (`stat_date`,`language`,`context_key`,`session_hash`)',\n\t\t\t\t\tself::$sessions_table\n\t\t\t\t)\n\t\t\t);", "add session index"),
              ("\t\t$rows = $wpdb->get_results( \"SHOW INDEX FROM `\" . $table . \"`\", ARRAY_A );", "\t\t$rows = $wpdb->get_results( $wpdb->prepare( 'SHOW INDEX FROM %i', $table ), ARRAY_A );", "show index"),
          ]
          for old, new, label in direct:
              storage = replace(storage, old, new, label)

          def prepared_query(sql_old, sql_new, arg_old, arg_new, label):
              global storage
              pos = storage.find(sql_old)
              if pos < 0:
                  raise SystemExit(f"Missing prepared SQL: {label}")
              storage = storage[:pos] + sql_new + storage[pos + len(sql_old):]
              arg_pos = storage.find(arg_old, pos)
              if arg_pos < 0:
                  raise SystemExit(f"Missing prepared argument: {label}")
              storage = storage[:arg_pos] + arg_new + storage[arg_pos + len(arg_old):]

          prepared_query('"INSERT INTO " . self::$daily_table . "\n', '"INSERT INTO %i\n', "\t\t\t\tcurrent_time( 'Y-m-d' ),", "\t\t\t\tself::$daily_table,\n\t\t\t\tcurrent_time( 'Y-m-d' ),", "increment event")
          prepared_query('"INSERT IGNORE INTO " . self::$sessions_table . "\n', '"INSERT IGNORE INTO %i\n', "\t\t\t\tcurrent_time( 'Y-m-d' ),", "\t\t\t\tself::$sessions_table,\n\t\t\t\tcurrent_time( 'Y-m-d' ),", "store session")
          prepared_query('"INSERT IGNORE INTO " . self::$confirmations_table . "\n', '"INSERT IGNORE INTO %i\n', "\t\t\t\t$reference_hash,", "\t\t\t\tself::$confirmations_table,\n\t\t\t\t$reference_hash,", "record confirmation")
          prepared_query('"DELETE FROM " . self::$daily_table . " WHERE stat_date < %s",', "'DELETE FROM %i WHERE stat_date < %s',", "\t\t\t\t$cutoff", "\t\t\t\tself::$daily_table,\n\t\t\t\t$cutoff", "cleanup daily")
          prepared_query('"DELETE FROM " . self::$sessions_table . " WHERE stat_date < %s",', "'DELETE FROM %i WHERE stat_date < %s',", "\t\t\t\t$cutoff", "\t\t\t\tself::$sessions_table,\n\t\t\t\t$cutoff", "cleanup sessions")
          prepared_query('"DELETE FROM " . self::$confirmations_table . " WHERE created_at < %s",', "'DELETE FROM %i WHERE created_at < %s',", "\t\t\t\t$cutoff . ' 00:00:00'", "\t\t\t\tself::$confirmations_table,\n\t\t\t\t$cutoff . ' 00:00:00'", "cleanup confirmations")

          storage = replace(
              storage,
              "\t\t$wpdb->query( 'TRUNCATE TABLE ' . self::$daily_table );\n\t\t$wpdb->query( 'TRUNCATE TABLE ' . self::$sessions_table );\n\t\t$wpdb->query( 'TRUNCATE TABLE ' . self::$confirmations_table );",
              "\t\t$wpdb->query( $wpdb->prepare( 'TRUNCATE TABLE %i', self::$daily_table ) );\n\t\t$wpdb->query( $wpdb->prepare( 'TRUNCATE TABLE %i', self::$sessions_table ) );\n\t\t$wpdb->query( $wpdb->prepare( 'TRUNCATE TABLE %i', self::$confirmations_table ) );",
              "truncate tables"
          )

          report_queries = [
              ("FROM \" . self::$daily_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY event_type\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY event_type\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$daily_table,\n\t\t\t\t$cutoff", "summary events"),
              ("FROM \" . self::$sessions_table . \"\n\t\t\t\tWHERE stat_date >= %s\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$sessions_table,\n\t\t\t\t$cutoff", "summary sessions"),
              ("FROM \" . self::$daily_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY stat_date\n\t\t\t\tORDER BY stat_date DESC\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY stat_date\n\t\t\t\tORDER BY stat_date DESC\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$daily_table,\n\t\t\t\t$cutoff", "daily events"),
              ("FROM \" . self::$sessions_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY stat_date\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY stat_date\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$sessions_table,\n\t\t\t\t$cutoff", "daily sessions"),
              ("FROM \" . self::$daily_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\t\tAND event_type IN ('donate_click','payment_open','external_click','copy_click','donation_success')", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\t\tAND event_type IN ('donate_click','payment_open','external_click','copy_click','donation_success')", "\t\t\t\tself::date_cutoff( $days )", "\t\t\t\tself::$daily_table,\n\t\t\t\tself::date_cutoff( $days )", "top targets"),
              ("FROM \" . self::$daily_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY context_key\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY context_key\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$daily_table,\n\t\t\t\t$cutoff", "context events"),
              ("FROM \" . self::$sessions_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY context_key\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY context_key\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$sessions_table,\n\t\t\t\t$cutoff", "context sessions"),
              ("FROM \" . self::$daily_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY language\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY language\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$daily_table,\n\t\t\t\t$cutoff", "language events"),
              ("FROM \" . self::$sessions_table . \"\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY language\",", "FROM %i\n\t\t\t\tWHERE stat_date >= %s\n\t\t\t\tGROUP BY language\",", "\t\t\t\t$cutoff", "\t\t\t\tself::$sessions_table,\n\t\t\t\t$cutoff", "language sessions"),
          ]
          for sql_old, sql_new, arg_old, arg_new, label in report_queries:
              prepared_query(sql_old, sql_new, arg_old, arg_new, label)

          storage = replace(
              storage,
              "\t\treturn array(\n\t\t\t'daily_rows'        => (int) $wpdb->get_var( \"SELECT COUNT(*) FROM \" . self::$daily_table ),\n\t\t\t'session_rows'      => (int) $wpdb->get_var( \"SELECT COUNT(*) FROM \" . self::$sessions_table ),\n\t\t\t'confirmation_rows' => (int) $wpdb->get_var( \"SELECT COUNT(*) FROM \" . self::$confirmations_table ),\n\t\t);",
              "\t\treturn array(\n\t\t\t'daily_rows'        => (int) $wpdb->get_var( $wpdb->prepare( 'SELECT COUNT(*) FROM %i', self::$daily_table ) ),\n\t\t\t'session_rows'      => (int) $wpdb->get_var( $wpdb->prepare( 'SELECT COUNT(*) FROM %i', self::$sessions_table ) ),\n\t\t\t'confirmation_rows' => (int) $wpdb->get_var( $wpdb->prepare( 'SELECT COUNT(*) FROM %i', self::$confirmations_table ) ),\n\t\t);",
              "table counts"
          )
          storage = storage.replace("\nStorage::init();", "\n// phpcs:enable\n\nStorage::init();")
          runtime = storage[storage.find("private static function remove_obsolete_indexes"):]
          for needle in ['\" . self::$daily_table . \"', '\" . self::$sessions_table . \"', '\" . self::$confirmations_table . \"', '\" . $table . \"']:
              if needle in runtime:
                  raise SystemExit(f"Unprepared dynamic table identifier remains: {needle}")
          write("includes/class-storage.php", storage)
          PY

      - name: PHP syntax check
        shell: bash
        run: |
          find ua-free-donate-stats -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Static release checks
        shell: bash
        run: |
          test ! -e ua-free-donate-stats/MIGRATION-NOTES.md
          grep -q "Version: 1.2.5" ua-free-donate-stats/ua-free-donate-stats.php
          grep -q "Stable tag: 1.2.5" ua-free-donate-stats/readme.txt
          grep -q "Tested up to: 7.0" ua-free-donate-stats/readme.txt
          ! grep -R "load_plugin_textdomain" ua-free-donate-stats/includes
          ! grep -R "fwrite(" ua-free-donate-stats/includes
          ! grep -R "fclose(" ua-free-donate-stats/includes
          grep -q "FROM %i" ua-free-donate-stats/includes/class-storage.php

      - name: Build installable ZIP
        shell: bash
        run: |
          rm -f releases/ua-free-donate-stats-1.2.5.zip
          mkdir -p releases
          zip -qr releases/ua-free-donate-stats-1.2.5.zip ua-free-donate-stats -x 'ua-free-donate-stats/MIGRATION-NOTES.md'
          unzip -t releases/ua-free-donate-stats-1.2.5.zip
          sha256sum releases/ua-free-donate-stats-1.2.5.zip > releases/ua-free-donate-stats-1.2.5.zip.sha256

      - name: Commit fixed plugin and release
        shell: bash
        run: |
          rm -f .github/workflows/fix-donate-stats-1.2.5.yml .github/workflows/test-create-file.yml
          git config user.name "UA FREE Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix UA FREE Donate Stats Plugin Check findings and release 1.2.5"
          git push
