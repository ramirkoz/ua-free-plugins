name: Publish Site Bridge 0.4.9

on:
  push:
    paths:
      - '.github/workflows/site-bridge-0.4.9-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Site Bridge package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/ua-free-site-bridge-0.4.9.zip \
            'https://drive.usercontent.google.com/download?id=1g17abAx5IkN9neXKDW8OakBwL2MZnBbe&export=download&confirm=t'
          echo '8b069a7a8c6a972d85d2e86d54b6ecd6c9712179b85732e085cab7b0ed5275ac  /tmp/ua-free-site-bridge-0.4.9.zip' | sha256sum -c -

      - name: Apply plugin source and build library 2.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ua-free-site-bridge
          unzip -q /tmp/ua-free-site-bridge-0.4.9.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import hashlib, json, shutil

          root = Path('.')
          releases = root / 'releases'
          old_library = releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip'
          plugin_zip = Path('/tmp/ua-free-site-bridge-0.4.9.zip')
          plugin_sha = hashlib.sha256(plugin_zip.read_bytes()).hexdigest()
          assert plugin_sha == '8b069a7a8c6a972d85d2e86d54b6ecd6c9712179b85732e085cab7b0ed5275ac'

          with ZipFile(old_library) as source:
              manifest = json.loads(source.read('manifest.json'))
              packages = {name: source.read(name) for name in source.namelist() if name.startswith('packages/')}

          manifest['version'] = '2.7'
          manifest['created'] = '2026-07-31'
          manifest['status'] = 'FINAL'
          packages.pop('packages/ua-free-site-bridge-v0.4.8.zip', None)
          packages['packages/ua-free-site-bridge-v0.4.9.zip'] = plugin_zip.read_bytes()

          for package in manifest['packages']:
              if package['slug'] == 'ua-free-site-bridge':
                  package['version'] = '0.4.9'
                  package['file'] = 'packages/ua-free-site-bridge-v0.4.9.zip'
                  package['sha256'] = plugin_sha
                  package['size'] = plugin_zip.stat().st_size
                  break
          else:
              raise RuntimeError('Site Bridge package missing from manifest')

          for package in manifest['packages']:
              data = packages[package['file']]
              assert hashlib.sha256(data).hexdigest() == package['sha256']
              assert len(data) == package['size']

          manifest_text = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          library_name = 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip'
          library = releases / library_name
          fixed_time = (2026, 7, 31, 13, 15, 0)
          with ZipFile(library, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              info = ZipInfo('manifest.json', fixed_time)
              info.compress_type = ZIP_DEFLATED
              info.external_attr = 0o644 << 16
              archive.writestr(info, manifest_text.encode('utf-8'))
              for package in sorted(manifest['packages'], key=lambda item: item['file']):
                  info = ZipInfo(package['file'], fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, packages[package['file']])

          library_sha = hashlib.sha256(library.read_bytes()).hexdigest()
          shutil.copy2(plugin_zip, releases / 'ua-free-site-bridge-0.4.9.zip')
          (releases / 'ua-free-site-bridge-0.4.9.sha256').write_text(
              plugin_sha + '  ua-free-site-bridge-0.4.9.zip\n', encoding='utf-8'
          )
          (releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.manifest.json').write_text(
              manifest_text, encoding='utf-8'
          )
          (releases / 'UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip.sha256').write_text(
              library_sha + '  ' + library_name + '\n', encoding='utf-8'
          )
          (releases / 'UA_FREE_SYNC_REPORT_2026-07-31_v2.7.md').write_text(
              '# UA FREE Synchronization Report\n\n'
              '- Date: 2026-07-31\n'
              '- Library: 2.7\n'
              '- Status: Site Bridge 0.4.9 Plugin Check PASS; package, manifest, ZIP, CRC, SHA-256 and PHP checks PASS.\n'
              '- Scope: Site Bridge updated; other 11 public packages and SHA-256 values preserved.\n\n'
              f'Plugin SHA-256: `{plugin_sha}`\n\n'
              f'Library SHA-256: `{library_sha}`\n',
              encoding='utf-8'
          )
          PY
          rm -f releases/ua-free-site-bridge-0.4.8.zip
          rm -f releases/ua-free-site-bridge-0.4.8.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.zip.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.6.manifest.json
          rm -f releases/UA_FREE_SYNC_REPORT_2026-07-31_v2.6.md

      - name: Validate plugin and library
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 0.4.9' ua-free-site-bridge/ua-free-site-bridge.php
          grep -q '^Stable tag: 0.4.9$' ua-free-site-bridge/readme.txt
          grep -q '^Tested up to: 7.0$' ua-free-site-bridge/readme.txt
          test ! -e ua-free-site-bridge/README_UK.md
          ! grep -R --include='*.php' -n 'auto_update_plugin' ua-free-site-bridge
          find ua-free-site-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import hashlib, json, pathlib, re, zipfile
          root = pathlib.Path('.')
          release = root / 'releases/ua-free-site-bridge-0.4.9.zip'
          assert hashlib.sha256(release.read_bytes()).hexdigest() == '8b069a7a8c6a972d85d2e86d54b6ecd6c9712179b85732e085cab7b0ed5275ac'
          with zipfile.ZipFile(release) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert names and all(name.startswith('ua-free-site-bridge/') for name in names)
          manifest_path = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '2.7'
          assert manifest['status'] == 'FINAL'
          assert len(manifest['packages']) == 12
          bridge = next(item for item in manifest['packages'] if item['slug'] == 'ua-free-site-bridge')
          assert bridge['version'] == '0.4.9'
          assert bridge['sha256'] == '8b069a7a8c6a972d85d2e86d54b6ecd6c9712179b85732e085cab7b0ed5275ac'
          library = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip'
          library_sha = hashlib.sha256(library.read_bytes()).hexdigest()
          recorded = (root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip.sha256').read_text().split()[0]
          assert library_sha == recorded
          with zipfile.ZipFile(library) as archive:
              assert archive.testzip() is None
              embedded = json.loads(archive.read('manifest.json'))
              assert embedded == manifest
              for package in embedded['packages']:
                  data = archive.read(package['file'])
                  assert hashlib.sha256(data).hexdigest() == package['sha256']
                  assert len(data) == package['size']
          PY

      - name: Record synchronization run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_CANONICAL_SYNC_RUN_ID.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-site-bridge-0.4.9-library-2.7
          path: |
            releases/ua-free-site-bridge-0.4.9.zip
            releases/ua-free-site-bridge-0.4.9.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.zip.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-31_v2.7.manifest.json
            releases/UA_FREE_SYNC_REPORT_2026-07-31_v2.7.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/site-bridge-0.4.9-sync.yml
          git config user.name 'UA FREE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release Site Bridge 0.4.9 and library 2.7'
          git push origin HEAD:main
