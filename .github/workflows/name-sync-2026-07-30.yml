name: Canonicalize UA FREE plugin names

on:
  push:
    paths:
      - '.github/workflows/name-sync-2026-07-30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext >/dev/null
          base64 -d .github/name-sync-2.2.py.gz.b64 | gzip -d > /tmp/name_sync.py

      - name: Canonicalize names and build library 2.2
        shell: bash
        run: python3 /tmp/name_sync.py

      - name: Record workflow run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_NAME_SYNC_RUN_ID.txt

      - name: Upload canonical release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-name-sync-2026-07-30-v2.2
          path: /tmp/ua-free-name-sync-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Commit synchronized repository state
        shell: bash
        run: |
          rm -f .github/name-sync-2.2.py.gz.b64
          rm -f .github/workflows/name-sync-2026-07-30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Canonicalize UA FREE plugin names and release library 2.2'
          git push
