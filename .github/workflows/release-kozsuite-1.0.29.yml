name: Release KOZ Suite 1.0.29

on:
  push:
    branches: [main]
    paths: [.release-1.0.29.trigger]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build, verify, publish and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -f .release-1.0.29.trigger
          grep -q 'Version: 0.9.39' koz-static-translate/koz-static-translate.php
          grep -q "define( 'KOZSTX_VERSION', '0.9.39' )" koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.39' koz-static-translate/readme.txt
          grep -q 'sanitize_text_field' koz-static-translate/includes/class-kozstx-cleanup.php
          ! grep -nE '(^|[^[:alnum:]_>])(chmod|rename|unlink|copy)[[:space:]]*\(' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q '\$filesystem->move' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q '\$filesystem->chmod' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q 'JSON_HEX_TAG' koz-static-translate/includes/class-kozstx-static-translate.php
          grep -q "return current_user_can( 'manage_options' );" koz-static-translate/includes/class-kozstx-static-translate.php
          ! grep -R "permission_callback.*__return_true" koz-static-translate --include='*.php'
          ! grep -R "deactivate_plugins" koz-static-translate --include='*.php'
          find koz-static-translate -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          for f in koz-static-translate/assets/*.js; do node --check "$f"; done

          python3 <<'PY'
          from pathlib import Path
          import zipfile, hashlib, json, shutil

          FIXED=(2026,8,27,12,50,0)
          EXPECTED_STATIC='6f83475eb5232419fdf8cfea3e64199c10e0149c01c9e737bcadc3e18bdba521'
          EXPECTED_SUITE='d7f79d4acb1eb10bea98943b51d0fd12191615687f9de237fb09437c40eefa64'

          def sha256(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):
                      h.update(b)
              return h.hexdigest()

          def write_dir(zf, arc):
              if not arc.endswith('/'):
                  arc += '/'
              zi=zipfile.ZipInfo(arc,FIXED)
              zi.create_system=3
              zi.external_attr=(0o40755 << 16) | 0x10
              zi.compress_type=zipfile.ZIP_STORED
              zf.writestr(zi,b'')

          def write_file(zf, src, arc):
              zi=zipfile.ZipInfo(arc,FIXED)
              zi.create_system=3
              zi.external_attr=(0o100644 << 16)
              zi.compress_type=zipfile.ZIP_DEFLATED
              zf.writestr(zi,Path(src).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)

          def zip_tree(src_root, out, root_name=None):
              src_root=Path(src_root); out=Path(out)
              if out.exists(): out.unlink()
              with zipfile.ZipFile(out,'w') as zf:
                  base=''
                  if root_name:
                      write_dir(zf,root_name)
                      base=root_name.rstrip('/')+'/'
                  entries=[]
                  for p in src_root.rglob('*'):
                      entries.append((base+p.relative_to(src_root).as_posix(),p))
                  for arc,p in sorted(entries,key=lambda x:x[0]):
                      if p.is_dir(): write_dir(zf,arc)
                      else: write_file(zf,p,arc)

          dist=Path('dist')
          packages=dist/'packages'; checksums=dist/'checksums'
          packages.mkdir(parents=True,exist_ok=True); checksums.mkdir(parents=True,exist_ok=True)

          static_zip=packages/'koz-static-translate-0.9.39.zip'
          zip_tree(Path('koz-static-translate'),static_zip,'koz-static-translate')
          static_sha=sha256(static_zip); static_size=static_zip.stat().st_size
          assert static_sha==EXPECTED_STATIC,(static_sha,EXPECTED_STATIC)
          for p in packages.glob('koz-static-translate-*.zip'):
              if p.name!='koz-static-translate-0.9.39.zip': p.unlink()
          for p in checksums.glob('koz-static-translate-*.zip.sha256'):
              p.unlink()
          (checksums/'koz-static-translate-0.9.39.zip.sha256').write_text(f'{static_sha}  koz-static-translate-0.9.39.zip\n',encoding='utf-8')

          manifest_path=dist/'manifest.json'
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          m['version']='1.0.29'; m['suite_version']='1.0.29'; m['created']='2026-08-27'; m['release_date']='2026-08-27'
          m['status']='CURRENT LIBRARY — 12/12 PACKAGE INTEGRITY PASS — STATIC TRANSLATE 0.9.39 PLUGIN CHECK PASS'
          for item in m.get('changed_components',[]):
              if item.get('name')=='KOZ Static Translate':
                  item.update(version='0.9.39',sha256=static_sha,live='NOT RE-RUN',plugin_check='PASS',wordpress_7_1='PLUGIN CHECK PASS')
          for item in m.get('packages',[]):
              if item.get('slug')=='koz-static-translate':
                  item.update(version='0.9.39',file='packages/koz-static-translate-0.9.39.zip',sha256=static_sha,size=static_size,
                              strict_re_audit='PASS',live_functional='NOT RE-RUN',plugin_check='PASS',wordpress_org_ready='YES',
                              wordpress_core_tested='PLUGIN CHECK PASS',wordpress_org_status='0.9.39 SUBMITTED — REVIEW IN PROGRESS')
          m.setdefault('wordpress_org',{})['koz-static-translate']='0.9.39 SUBMITTED — REVIEW IN PROGRESS'
          for k in list(m):
              if k.startswith('changes_from_'): m.pop(k)
          m['changes_from_1_0_28']=[
              'KOZ Static Translate updated from 0.9.38 to 0.9.39.',
              'WordPress Plugin Check filesystem findings remediated.',
              'T3 security remediations retained: non-public backups and JSON_HEX inline configuration.',
              'Other 11 public plugin packages remain byte-identical to KOZ Suite 1.0.28.'
          ]
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Rebuild package checksums from the actual release bytes.
          sum_lines=[]
          for p in sorted(packages.glob('*.zip')):
              h=sha256(p)
              (checksums/(p.name+'.sha256')).write_text(f'{h}  {p.name}\n',encoding='utf-8')
              sum_lines.append(f'{h}  packages/{p.name}')
          (dist/'SHA256SUMS.txt').write_text('\n'.join(sum_lines)+'\n',encoding='utf-8')

          # Build suite from the 12 current packages + release metadata.
          build=Path('/tmp/kozsuite1029')
          if build.exists(): shutil.rmtree(build)
          (build/'packages').mkdir(parents=True); (build/'checksums').mkdir()
          for p in packages.glob('*.zip'): shutil.copy2(p,build/'packages'/p.name)
          for p in checksums.glob('*.sha256'): shutil.copy2(p,build/'checksums'/p.name)
          shutil.copy2(manifest_path,build/'manifest.json')
          shutil.copy2(dist/'SHA256SUMS.txt',build/'SHA256SUMS.txt')
          suite_zip=dist/'KOZ-Suite-1.0.29.zip'
          zip_tree(build,suite_zip,None)
          suite_sha=sha256(suite_zip)
          assert suite_sha==EXPECTED_SUITE,(suite_sha,EXPECTED_SUITE)
          (dist/'KOZ-Suite-1.0.29.zip.sha256').write_text(f'{suite_sha}  KOZ-Suite-1.0.29.zip\n',encoding='utf-8')

          notes=Path('RELEASE_NOTES_v1.0.29.md')
          notes.write_text(f'''# KOZ WordPress Plugin Suite 1.0.29\n\nRelease date: 2026-08-27\n\n## Updated component\n\n- KOZ Static Translate: 0.9.38 → 0.9.39.\n- WordPress Plugin Check filesystem findings remediated.\n- T3 security remediations retained.\n- Other 11 public plugins unchanged from Suite 1.0.28.\n\n## Verification\n\n- KOZ Static Translate 0.9.39 Plugin Check: PASS.\n- Static security audit: PASS.\n- PHP syntax: PASS.\n- JavaScript syntax: PASS.\n- ZIP integrity: PASS.\n- KOZ Static Translate 0.9.39 SHA-256: `{static_sha}`.\n- KOZ Suite 1.0.29 SHA-256: `{suite_sha}`.\n''',encoding='utf-8')

          r=Path('README.md')
          text=r.read_text(encoding='utf-8')
          import re
          text=re.sub(r'Suite bundle: \*\*[0-9.]+\*\*','Suite bundle: **1.0.29**',text)
          text=re.sub(r'\*\*KOZ Suite Bundle [0-9.]+\*\*','**KOZ Suite Bundle 1.0.29**',text)
          text=re.sub(r'\| koz-static-translate \| [0-9.]+ \|','| koz-static-translate | 0.9.39 |',text)
          text=re.sub(r'- WordPress.org: \*\*KOZ Static Translate .*','- WordPress.org: **KOZ Static Translate 0.9.39 submitted — review in progress**',text)
          r.write_text(text,encoding='utf-8')
          PY

          unzip -tq dist/packages/koz-static-translate-0.9.39.zip
          unzip -tq dist/KOZ-Suite-1.0.29.zip

          rm -f .release-1.0.29.trigger
          rm -f .github/workflows/release-kozsuite-1.0.29.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release KOZ Static Translate 0.9.39 and Suite 1.0.29'
          git push origin HEAD:main

          if gh release view v1.0.29 >/dev/null 2>&1; then
            gh release upload v1.0.29 dist/KOZ-Suite-1.0.29.zip dist/packages/koz-static-translate-0.9.39.zip --clobber
            gh release edit v1.0.29 --title 'KOZ Suite 1.0.29' --notes-file RELEASE_NOTES_v1.0.29.md --target main
          else
            gh release create v1.0.29 dist/KOZ-Suite-1.0.29.zip dist/packages/koz-static-translate-0.9.39.zip --title 'KOZ Suite 1.0.29' --notes-file RELEASE_NOTES_v1.0.29.md --target main
          fi
