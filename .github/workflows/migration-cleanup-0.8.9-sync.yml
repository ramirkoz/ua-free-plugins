name: Publish Migration & Cleanup 0.8.9

on:
  push:
    paths:
      - '.github/workflows/migration-cleanup-0.8.9-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified synchronization payload
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/migration-sync-payload.tar.gz \
            'https://drive.usercontent.google.com/download?id=14FH9TcwWmymiNKo7pmRh83BHH-a0SK0a&export=download&confirm=t'
          echo '2a6a18c145d5f20a19b6a306c019edeb31cc4fdc4d45e719bd4a16b4210e803d  /tmp/migration-sync-payload.tar.gz' | sha256sum -c -

      - name: Apply canonical package state
        shell: bash
        run: |
          set -euo pipefail
          rm -f releases/ua-free-migration-cleanup-0.8.8.zip
          rm -f releases/ua-free-migration-cleanup-0.8.8.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.2.1.zip
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.2.1.zip.sha256
          rm -f releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.2.1.manifest.json
          rm -f releases/UA_FREE_SYNC_REPORT_2026-07-30_v2.2.1.md
          tar -xzf /tmp/migration-sync-payload.tar.gz -C .

      - name: Validate plugin and library
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 0.8.9$' ua-free-migration-cleanup/ua-free-migration-cleanup.php
          grep -q '^Stable tag: 0.8.9$' ua-free-migration-cleanup/readme.txt
          grep -q '^Tested up to: 7.0$' ua-free-migration-cleanup/readme.txt
          ! grep -R --include='*.php' -n 'UAFREE_MC_TEXT_DOMAIN' ua-free-migration-cleanup
          ! grep -R --include='*.php' -n 'load_plugin_textdomain' ua-free-migration-cleanup
          find ua-free-migration-cleanup -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 - <<'PY'
          import hashlib, json, pathlib, re, zipfile
          root = pathlib.Path('.')
          release = root / 'releases/ua-free-migration-cleanup-0.8.9.zip'
          release_sha = hashlib.sha256(release.read_bytes()).hexdigest()
          assert release_sha == '48f93b542e063fc603fb3e99e7a1e0b3bf179f4e76d8aa75b28cceacea842621'
          with zipfile.ZipFile(release) as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              assert names and all(n.startswith('ua-free-migration-cleanup/') for n in names)
              main = zf.read('ua-free-migration-cleanup/ua-free-migration-cleanup.php').decode('utf-8')
              readme = zf.read('ua-free-migration-cleanup/readme.txt').decode('utf-8')
              assert re.search(r'^ \* Version: 0\.8\.9$', main, re.M)
              assert re.search(r'^Stable tag: 0\.8\.9$', readme, re.M)
          manifest_path = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['version'] == '2.3'
          assert manifest['status'] == 'FINAL'
          assert len(manifest['packages']) == 12
          migration = next(p for p in manifest['packages'] if p['slug'] == 'ua-free-migration-cleanup')
          assert migration['version'] == '0.8.9'
          assert migration['sha256'] == release_sha
          library = root / 'releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip'
          library_sha = hashlib.sha256(library.read_bytes()).hexdigest()
          assert library_sha == '40aa85ac6c2345175e1c0435821b6df9444b30ac5fe5803116bfc177d5452873'
          with zipfile.ZipFile(library) as zf:
              assert zf.testzip() is None
              embedded = json.loads(zf.read('manifest.json'))
              assert embedded == manifest
              for package in embedded['packages']:
                  data = zf.read(package['file'])
                  assert hashlib.sha256(data).hexdigest() == package['sha256']
                  assert len(data) == package['size']
          PY

      - name: Record synchronization run
        shell: bash
        run: printf '%s\n' "$GITHUB_RUN_ID" > releases/UA_FREE_LAST_CANONICAL_SYNC_RUN_ID.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ua-free-migration-cleanup-0.8.9-library-2.3
          path: |
            releases/ua-free-migration-cleanup-0.8.9.zip
            releases/ua-free-migration-cleanup-0.8.9.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.zip.sha256
            releases/UA_FREE_HUB_RELEASE_LIBRARY_FINAL_2026-07-30_v2.3.manifest.json
            releases/UA_FREE_SYNC_REPORT_2026-07-30_v2.3.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical synchronized state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migration-cleanup-0.8.9-sync.yml
          git config user.name 'UA FREE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release Migration & Cleanup 0.8.9 and library 2.3'
          git push origin HEAD:main
