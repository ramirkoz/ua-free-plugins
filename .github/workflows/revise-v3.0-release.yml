name: Revise UA FREE WordPress Plugin Suite 3.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/revise-v3.0-release.yml

permissions:
  contents: write

jobs:
  revise-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release library and individual plugin ZIP files
        run: python tools/build-release-library.py --output dist

      - name: Verify every local release asset
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Update and verify the public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v3.0"

          gh release upload "$TAG" \
            dist/*.zip \
            dist/*.sha256 \
            dist/SHA256SUMS.txt \
            dist/manifest.json \
            --clobber

          gh release edit "$TAG" \
            --title "UA FREE WordPress Plugin Suite 3.0 — 12 Privacy-First Plugins" \
            --notes-file releases/v3.0.md \
            --latest

          ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          test "$ASSET_COUNT" -ge 28

          mkdir -p release-check
          gh release download "$TAG" \
            --pattern "ua-free-copy-1.0.7.zip" \
            --dir release-check
          cmp \
            dist/ua-free-copy-1.0.7.zip \
            release-check/ua-free-copy-1.0.7.zip

          gh release view "$TAG" --json name,tagName,assets,url

      - name: Remove the one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/revise-v3.0-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete v3.0 release revision"
          git push
