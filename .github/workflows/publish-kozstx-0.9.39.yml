name: Publish KOZ Static Translate 0.9.39

on:
  push:
    branches: [main]
    paths: [.release/kozstx-0.9.39.trigger]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply, verify and publish 0.9.39
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/kozstx-0.9.39.patch
          test -f .release/kozstx-0.9.39.trigger
          git apply --check .release/kozstx-0.9.39.patch
          git apply .release/kozstx-0.9.39.patch

          grep -q 'Version: 0.9.39' koz-static-translate/koz-static-translate.php
          grep -q "define( 'KOZSTX_VERSION', '0.9.39' )" koz-static-translate/koz-static-translate.php
          grep -q 'Stable tag: 0.9.39' koz-static-translate/readme.txt
          grep -q 'sanitize_text_field.*DOCUMENT_ROOT\|DOCUMENT_ROOT.*sanitize_text_field' koz-static-translate/includes/class-kozstx-cleanup.php || grep -q 'sanitize_text_field' koz-static-translate/includes/class-kozstx-cleanup.php
          ! grep -nE '(^|[^[:alnum:]_>])(chmod|rename|unlink|copy)[[:space:]]*\(' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q '\$filesystem->move' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q '\$filesystem->chmod' koz-static-translate/includes/class-kozstx-cleanup.php
          grep -q 'JSON_HEX_TAG' koz-static-translate/includes/class-kozstx-static-translate.php
          grep -q "return current_user_can( 'manage_options' );" koz-static-translate/includes/class-kozstx-static-translate.php
          ! grep -R "permission_callback.*__return_true" koz-static-translate --include='*.php'
          ! grep -R "deactivate_plugins" koz-static-translate --include='*.php'

          find koz-static-translate -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          for f in koz-static-translate/assets/*.js; do node --check "$f"; done

          find koz-static-translate -exec touch -t 202608271250.00 {} +
          find koz-static-translate -print | LC_ALL=C sort | zip -X -q /tmp/KOZ-Static-Translate-0.9.39.zip -@
          unzip -tq /tmp/KOZ-Static-Translate-0.9.39.zip
          SHA="$(sha256sum /tmp/KOZ-Static-Translate-0.9.39.zip | awk '{print $1}')"
          SIZE="$(wc -c < /tmp/KOZ-Static-Translate-0.9.39.zip | tr -d ' ')"

          mkdir -p dist/packages dist/checksums
          cp /tmp/KOZ-Static-Translate-0.9.39.zip dist/packages/koz-static-translate-0.9.39.zip
          printf '%s  %s\n' "$SHA" 'koz-static-translate-0.9.39.zip' > dist/checksums/koz-static-translate-0.9.39.zip.sha256
          rm -f dist/packages/koz-static-translate-0.9.38.zip dist/checksums/koz-static-translate-0.9.38.zip.sha256

          python3 - "$SHA" "$SIZE" <<'PY'
          import json, sys
          from pathlib import Path
          sha, size = sys.argv[1], int(sys.argv[2])
          p = Path('dist/manifest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          for item in d.get('changed_components', []):
              if item.get('name') == 'KOZ Static Translate':
                  item['version'] = '0.9.39'
                  item['sha256'] = sha
                  item['live'] = 'STATIC PASS'
                  item['plugin_check'] = 'PENDING USER RUN'
                  item['wordpress_7_1'] = 'STATIC PASS'
          for item in d.get('packages', []):
              if item.get('slug') == 'koz-static-translate':
                  item['version'] = '0.9.39'
                  item['file'] = 'packages/koz-static-translate-0.9.39.zip'
                  item['sha256'] = sha
                  item['size'] = size
                  item['strict_re_audit'] = 'PASS'
                  item['live_functional'] = 'PENDING USER RUN'
                  item['plugin_check'] = 'PENDING USER RUN'
                  item['wordpress_org_status'] = '0.9.39 PLUGIN CHECK REMEDIATION — READY FOR RE-TEST'
          d.setdefault('wordpress_org', {})['koz-static-translate'] = '0.9.39 READY FOR PLUGIN CHECK / LIVE RE-TEST'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          r = Path('README.md')
          text = r.read_text(encoding='utf-8')
          text = text.replace('| koz-static-translate | 0.9.37 |', '| koz-static-translate | 0.9.39 |')
          text = text.replace('| koz-static-translate | 0.9.38 |', '| koz-static-translate | 0.9.39 |')
          text = text.replace('KOZ Static Translate 0.9.37 submitted — review in progress', 'KOZ Static Translate 0.9.39 ready for Plugin Check/live re-test')
          text = text.replace('KOZ Static Translate 0.9.38', 'KOZ Static Translate 0.9.39')
          r.write_text(text, encoding='utf-8')
          PY

          rm -rf .release
          rm -f .github/workflows/publish-kozstx-0.9.39.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish KOZ Static Translate 0.9.39 Plugin Check remediation'
          git push origin HEAD:main
